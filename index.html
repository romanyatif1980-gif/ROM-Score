<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎮 تسجيل السكورات</title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .setup, .game, .wins { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin: 20px auto; max-width: 900px; }
    input, select, button { padding: 7px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { cursor: pointer; font-weight: bold; }
    .start { background: #4caf50; color: white; }
    .add { background: #2196f3; color: white; }
    .top-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 150px; text-align: center; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; padding: 5px; text-align: center; }
    .buttons { margin: 20px 0; text-align: center; }
    .buttons button { margin: 5px; padding: 10px 15px; border: none; border-radius: 8px; }
    .end { background: #f44336; color: white; }
    .edit-small { background: #ff9800; color: white; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
    .small { font-size: 12px; padding:6px 10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>🎮 تسجيل السكورات</h1>

  <div class="setup" id="setup">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎲 اختر اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>لعبة الورق</option>
    </select>
    <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
    <button id="addGameBtn" class="add">➕ إضافة لعبة</button>

    <hr>

    <h3>👥 اختر اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

    <br>
    <div style="margin-top:10px;">
      <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
      <button id="clearStorageBtn" class="small" style="background:#e0e0e0;">🗑️ مسح بيانات التخزين</button>
      <button id="showActiveGamesBtn" class="small" style="background:#ffd700;">🎮 عرض الجيمات الشغالة</button>
    </div>
  </div>

  <div class="game" id="game" style="display:none;">
    <h2 id="gameName"></h2>
    <div class="top-players" id="topPlayers"></div>
    <table id="playersTable">
      <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>

    <h2 style="margin-top:40px;">📊 جدول الجولات</h2>
    <div class="buttons">
      <button id="addRoundBtn" class="add">➕ إضافة جولة جديدة</button>
      <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
    </div>
    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div class="wins" id="winsTable">
    <h2>🏆 ترتيب اللاعبين حسب عدد الفوز</h2>
    <table>
      <thead><tr><th>اللاعب</th><th>عدد الفوز</th></tr></thead>
      <tbody id="winsBody"></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, push, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.appspot.com",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let players = [];
    let playersWins = [];
    let roundCount = 0;
    let gameEnded = false;
    let editableRound = null;
    let currentGameKey = null;

    const DEFAULT_FIXED_PLAYERS = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    let fixedPlayers = DEFAULT_FIXED_PLAYERS.slice();

    function renderPlayerChoices() {
      const container = document.getElementById("playerChoices");
      container.innerHTML = "";
      fixedPlayers.forEach(name => {
        const label = document.createElement("label");
        label.style.marginRight = "8px";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = name;
        if(players.some(p=>p.name===name) && !gameEnded) checkbox.checked = true;
        label.appendChild(checkbox);
        label.append(" " + name + " ");
        container.appendChild(label);
      });
    }

    function addPlayer() {
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if(!name) return;
      if(!fixedPlayers.includes(name)) fixedPlayers.push(name);
      input.value = "";
      renderPlayerChoices();
    }

    function addGame() {
      const input = document.getElementById("newGameInput");
      const name = input.value.trim();
      if(!name) return;
      const select = document.getElementById("gameSelect");
      if(!Array.from(select.options).some(o=>o.value===name)) {
        const option = document.createElement("option");
        option.textContent = name;
        option.value = name;
        select.appendChild(option);
      }
      select.value = name;
      input.value = "";
    }

    function saveGameToFirebase() {
      if(!currentGameKey) return;
      const gameRef = ref(db, "games/" + currentGameKey);
      set(gameRef, { players, playersWins, roundCount, gameEnded, editableRound, gameName: document.getElementById("gameSelect").value, timestamp: new Date().toISOString() });
    }

    function startGame() {
      const checked = Array.from(document.querySelectorAll("#playerChoices input:checked")).map(c => c.value);
      if(checked.length < 2) { alert("لازم تختار على الأقل لاعبين!"); return; }

      players = [];
      playersWins = [];
      checked.forEach(name => {
        players.push({ name, scores: [], total: 0, wins: 0 });
        playersWins.push({ name, wins: 0 });
      });

      roundCount = 0;
      gameEnded = false;
      editableRound = null;

      const gameName = document.getElementById("gameSelect").value;
      currentGameKey = gameName + "_" + Date.now();
      document.getElementById("gameName").textContent = "🎲 اللعبة: " + gameName;

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";

      renderTopPlayers();
      renderPlayersTable();
      renderRounds();
      renderWinsTable();

      saveGameToFirebase();
    }

    function renderTopPlayers() {
      const topDiv = document.getElementById("topPlayers");
      topDiv.innerHTML = "";
      players.slice().sort((a,b)=>b.total-a.total).forEach(p=>{
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `${p.name}<br>⭐ ${p.total}`;
        topDiv.appendChild(card);
      });
    }

    function renderPlayersTable() {
      const body = document.getElementById("playersBody");
      body.innerHTML = "";
      players.slice().sort((a,b)=>b.total-a.total).forEach(p=>{
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.name}</td><td>${p.total || 0}</td>`;
        body.appendChild(row);
      });
    }

    function renderRounds() {
      const head = document.getElementById("roundsHead");
      const body = document.getElementById("roundsBody");

      let headHTML = "<tr><th>الجولة</th>";
      players.forEach(p=>headHTML+=`<th>${p.name}</th>`);
      headHTML += "<th>تعديل</th></tr>";
      head.innerHTML = headHTML;

      let totalRow = "<tr style='background:#eee; font-weight:bold;'><td>المجموع</td>";
      players.forEach(p=>totalRow+=`<td>${p.total || 0}</td>`);
      totalRow+="<td>-</td></tr>";
      body.innerHTML = totalRow;

      for(let r=0;r<roundCount;r++){
        let row = `<tr><td>جولة ${r+1}</td>`;
        players.forEach((p,i)=>{
          const val = (Array.isArray(p.scores)&&p.scores[r]!==undefined)?p.scores[r]:"";
          row += `<td><input type="number" value="${val}" onchange="updateScore(${i},${r},this.value)"></td>`;
        });
        row+=`<td><button class="edit-small" onclick="editRound(${r})" ${gameEnded?"disabled":""}>✏️</button></td>`;
        row+=`</tr>`;
        body.innerHTML += row;
      }
    }

    function addRound() {
      roundCount++;
      players.forEach(p=>{ if(!Array.isArray(p.scores)) p.scores=[]; while(p.scores.length<roundCount) p.scores.push(0); });
      editableRound = roundCount-1;
      renderRounds();
      saveGameToFirebase();
    }

    function editRound(r){ editableRound=r; renderRounds(); alert("ممكن تعدل جولة "+(r+1)); }

    window.updateScore = function(playerIndex, roundIndex, value){
      players[playerIndex].scores[roundIndex] = Number(value);
      players[playerIndex].total = players[playerIndex].scores.reduce((a,b)=>a+b,0);
      renderTopPlayers(); renderPlayersTable(); renderRounds(); saveGameToFirebase();
    }

    function endGame() {
      gameEnded=true;
      editableRound=null;
      let winner = players.reduce((best,cur)=>!best?cur:(cur.total>best.total?cur:best),null);
      if(winner){ winner.wins++; const found=playersWins.find(p=>p.name===winner.name); if(found) found.wins=winner.wins; else playersWins.push({name:winner.name,wins:winner.wins}); }
      renderPlayersTable(); renderWinsTable(); saveGameToFirebase();
      alert("تم إنهاء الجيم ✅ الفائز: "+(winner?winner.name:"لا يوجد"));
    }

    function renderWinsTable() {
      const body=document.getElementById("winsBody");
      body.innerHTML="";
      playersWins.slice().sort((a,b)=>b.wins-a.wins).forEach(p=>{
        const row=document.createElement("tr");
        row.innerHTML=`<td>${p.name}</td><td>${p.wins || 0}</td>`;
        body.appendChild(row);
      });
    }

    function clearStorage() {
      if(!confirm("هل تريد مسح كل بيانات التطبيق من المتصفح؟")) return;
      players=[]; playersWins=[]; roundCount=0; gameEnded=false; editableRound=null; currentGameKey=null;
      renderPlayerChoices(); renderPlayersTable(); renderRounds(); renderWinsTable();
      alert("تم مسح البيانات.");
    }

    function showActiveGames(){
      get(ref(db,"games")).then(snapshot=>{
        const games = snapshot.val();
        if(!games){ alert("لا توجد جيمات شغالة حاليا."); return; }
        const keys=Object.keys(games);
        let list="الجيمات الشغالة:\n";
        keys.forEach(k=>{ list+=k+"\n"; });
        const choice=prompt(list+"\nاكتب اسم الجيم الذي تريد الدخول إليه:");
        if(choice && games[choice]){
          currentGameKey=choice;
          const g = games[choice];
          players=g.players; playersWins=g.playersWins; roundCount=g.roundCount; gameEnded=g.gameEnded; editableRound=g.editableRound;
          document.getElementById("gameName").textContent="🎲 اللعبة: "+g.gameName;
          document.getElementById("setup").style.display="none"; document.getElementById("game").style.display="block";
          renderTopPlayers(); renderPlayersTable(); renderRounds(); renderWinsTable();
        }
      });
    }

    document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
    document.getElementById('addGameBtn').addEventListener('click', addGame);
    document.getElementById('startGameBtn').addEventListener('click', startGame);
    document.getElementById('addRoundBtn').addEventListener('click', addRound);
    document.getElementById('endGameBtn').addEventListener('click', endGame);
    document.getElementById('clearStorageBtn').addEventListener('click', clearStorage);
    document.getElementById('showActiveGamesBtn').addEventListener('click', showActiveGames);

    const liveRef = ref(db,"games");
    onValue(liveRef, snapshot=>{
      if(currentGameKey && snapshot.val() && snapshot.val()[currentGameKey]){
        const g = snapshot.val()[currentGameKey];
        players=g.players; playersWins=g.playersWins; roundCount=g.roundCount; gameEnded=g.gameEnded; editableRound=g.editableRound;
        renderTopPlayers(); renderPlayersTable(); renderRounds(); renderWinsTable();
      }
    });

    window.addEventListener('DOMContentLoaded', renderPlayerChoices);
  </script>
</body>
</html>
