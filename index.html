<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🎮 تسجيل السكورات (Live - Firebase)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
  h1,h2,h3 { text-align:center; color:#333; }
  .section { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin:20px auto; max-width:900px; }
  input,select,button { padding:7px; margin:5px; border-radius:8px; border:1px solid #ccc; font-size:14px; }
  button { cursor:pointer; font-weight:bold; }
  .start { background:#4caf50; color:white; }
  .add { background:#2196f3; color:white; }
  .end { background:#f44336; color:white; }
  .small { font-size:12px; padding:6px 10px; border-radius:6px; }
  .delete-small { font-size:12px; padding:3px 6px; border-radius:6px; background:#f44336; color:white; }
  table { width:100%; border-collapse:collapse; margin-top:20px; background:#fff; }
  th,td { border:1px solid #ddd; padding:8px; text-align:center; }
  th { background:#eee; }
  .top-players { display:flex; flex-wrap:wrap; justify-content:center; gap:15px; margin:20px 0; }
  .card { background:#fff; padding:15px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.1); width:150px; text-align:center; font-weight:bold; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:999; }
  .modal { background:white; padding:16px; border-radius:10px; width:90%; max-width:600px; max-height:70vh; overflow:auto; }
  .toast-container { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast { pointer-events:auto; min-width:220px; max-width:90vw; padding:10px 14px; border-radius:10px; background:#222; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,0.2); font-weight:bold; text-align:center; opacity:0; transform:translateY(-6px); animation:toast-in 300ms forwards; }
  .toast.success { background:#4caf50; }
  .toast.info { background:#2196f3; }
  .toast.warn { background:#f44336; }
  @keyframes toast-in { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toast-out { from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-6px);} }
</style>
</head>
<body>
<h1>🎮 تسجيل السكورات</h1>

<div class="section" id="setup">
  <h2>⚙️ إعداد الجيم</h2>
  <label>🎲 اختر اللعبة:</label>
  <select id="gameSelect">
    <option>دومينو</option>
    <option>الطاولة</option>
    <option>الشطرنج</option>
    <option>لعبة الورق</option>
  </select>
  <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
  <button id="addGameBtn" class="add">➕ إضافة لعبة</button>

  <hr>

  <h3>👥 اختر اللاعبين:</h3>
  <div id="playerChoices"></div>
  <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
  <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

  <div style="margin-top:10px;">
    <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
    <button id="clearWinsBtn" class="small" style="background:#e0e0e0;">🗑️ مسح بيانات الفوز</button>
  </div>
</div>

<div class="section" id="game" style="display:none;">
  <h2 id="gameName"></h2>
  <div class="top-players" id="topPlayers"></div>

  <table id="playersTable">
    <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
    <tbody id="playersBody"></tbody>
  </table>

  <h2 style="margin-top:30px;">📊 جدول الجولات</h2>
  <div style="margin:10px 0; text-align:center;">
    <button id="addRoundBtn" class="add">➕ إضافة جولة</button>
    <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
  </div>
  <table id="roundsTable">
    <thead id="roundsHead"></thead>
    <tbody id="roundsBody"></tbody>
  </table>
</div>

<div class="section" id="winsTable">
  <h2>🏆 ترتيب اللاعبين حسب عدد الفوز</h2>
  <table>
    <thead><tr><th>اللاعب</th><th>عدد الفوز</th></tr></thead>
    <tbody id="winsBody"></tbody>
  </table>
</div>

<div class="section">
  <div style="text-align:center; margin-bottom:10px;">
    <button id="showActiveBtn" class="small">🎯 الجيمات الشغالة</button>
    <button id="showFinishedBtn" class="small">🏁 الجيمات المنتهية</button>
  </div>
</div>

<div id="roomsModal" class="modal-backdrop">
  <div class="modal">
    <h3 id="roomsTitle"></h3>
    <div id="roomsList" style="margin-top:8px;"></div>
    <div style="text-align:center; margin-top:12px;">
      <button id="closeRoomsBtn" class="small">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
  authDomain: "rom-score.firebaseapp.com",
  databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
  projectId: "rom-score",
  storageBucket: "rom-score.firebasestorage.app",
  messagingSenderId: "1009545441375",
  appId: "1:1009545441375:web:460f2db0c984d24936abea",
  measurementId: "G-BKNE7YZ7FM"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_FIXED_PLAYERS=["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
let fixedPlayers=DEFAULT_FIXED_PLAYERS.slice();
let players=[]; let playersWins=[]; let roundCount=0;
let gameEnded=false; let lastGameName=""; let currentGameId=null; let currentGameRef=null;
let localScoresBuffer={};

function isText(x){ return typeof x==="string"&&x.trim().length>0; }
function sanitizeForKey(name){ return isText(name)?name.replace(/[.#$\[\]\/]/g,"_").trim():"player"; }
function todayDateStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function gameRefById(id){ return ref(db, `games/${id}`); }
function winsRef(){ return ref(db, "playersWins"); }

function recalcTotalsLocal(){ players.forEach(p=>{ p.total=(Array.isArray(p.scores)?p.scores.reduce((a,b)=>a+(Number.isFinite(b)?b:0),0):0); }); }
function renderPlayerChoices(){ const div=document.getElementById("playerChoices"); div.innerHTML=""; fixedPlayers.forEach(n=>{ const chk=players.find(p=>p.name===n)?'checked':""; div.innerHTML+=`<div><label><input type="checkbox" value="${n}" ${chk}> ${n}</label></div>`; }); }
function renderPlayersTable(){ const tbody=document.getElementById("playersBody"); tbody.innerHTML=""; players.forEach(p=>{ tbody.innerHTML+=`<tr><td>${p.name}</td><td>${p.total||0}</td></tr>`; }); }
function renderTopPlayers(){ const div=document.getElementById("topPlayers"); div.innerHTML=""; players.sort((a,b)=>b.total-a.total).slice(0,4).forEach(p=>{ const c=document.createElement("div"); c.className="card"; c.textContent=`${p.name}: ${p.total||0}`; div.appendChild(c); }); }
function renderWinsTable(){ const tbody=document.getElementById("winsBody"); tbody.innerHTML=""; playersWins.sort((a,b)=>b.wins-a.wins).forEach(p=>{ tbody.innerHTML+=`<tr><td>${p.name}</td><td>${p.wins}</td></tr>`; }); }

function renderRounds(){
  const head=document.getElementById("roundsHead"), body=document.getElementById("roundsBody");
  head.innerHTML=""; body.innerHTML="";
  if(players.length===0) return;
  const trh=document.createElement("tr"); trh.innerHTML="<th>الجولة</th>";
  for(let i=0;i<players.length;i++) trh.innerHTML+=`<th>${players[i].name}</th>`;
  head.appendChild(trh);

  for(let r=0;r<roundCount;r++){
    const tr=document.createElement("tr"); tr.innerHTML=`<td>جولة ${r+1}</td>`;
    players.forEach((p,pi)=>{
      const val=(Array.isArray(p.scores)&&Number.isFinite(p.scores[r]))?p.scores[r]:"";
      tr.innerHTML+=`<td><input type="number" value="${val}" data-pi="${pi}" data-ri="${r}" style="width:50px"></td>`;
    });
    body.appendChild(tr);
  }

  document.querySelectorAll("#roundsBody input").forEach(inp=>{
    inp.oninput=function(){
      const pi=Number(this.dataset.pi), ri=Number(this.dataset.ri), v=Number(this.value);
      if(!players[pi].scores) players[pi].scores=[];
      players[pi].scores[ri]=v; localScoresBuffer[`${pi}_${ri}`]=v;
      recalcTotalsLocal(); renderPlayersTable(); renderTopPlayers(); saveToDB();
    };
  });
}

function saveToDB(){
  if(!currentGameRef) return;
  const payload={ players,fixedPlayers,playersWins,roundCount,gameEnded,gameName:lastGameName };
  set(currentGameRef,payload);
  const winsObj={}; playersWins.forEach(w=>winsObj[w.name]={name:w.name,wins:w.wins});
  set(winsRef(),winsObj);
}

function showToast(msg,type="info",time=2500){
  const c=document.getElementById("toastContainer"), d=document.createElement("div");
  d.className="toast "+type; d.textContent=msg; c.appendChild(d);
  setTimeout(()=>{ d.style.animation="toast-out 300ms forwards"; setTimeout(()=>d.remove(),300); },time);
}

// إدارة الجيمات
function refreshRooms(){
  get(ref(db,"games")).then(snap=>{
    if(!snap.exists()) return;
    const allGames=[]; snap.forEach(s=>allGames.push({id:s.key,...s.val()}));
    window.allGames=allGames;
  });
}
function showRoomsModal(title,list){
  const modal=document.getElementById("roomsModal");
  document.getElementById("roomsTitle").textContent=title;
  const roomsList=document.getElementById("roomsList"); roomsList.innerHTML="";
  list.forEach(game=>{
    const div=document.createElement("div");
    div.innerHTML=`<span class="game-title">${game.gameName||game.id}</span>
      <span>
        <button class="small" data-id="${game.id}" data-action="open">فتح</button>
        <button class="delete-small" data-id="${game.id}" data-action="delete">حذف</button>
      </span>`;
    roomsList.appendChild(div);
  });
  modal.style.display="flex";
  roomsList.querySelectorAll("button").forEach(btn=>{
    btn.onclick=function(){
      const id=this.dataset.id, action=this.dataset.action;
      if(action==="open"){ currentGameId=id; currentGameRef=gameRefById(id); get(currentGameRef).then(snap=>{ if(snap.exists()) applySnapshotToLocal(snap.val()); modal.style.display="none"; }); }
      else if(action==="delete"){ if(confirm("هل تريد حذف هذا الجيم؟")){ remove(gameRefById(id)).then(()=>{ showToast("تم حذف الجيم","warn"); refreshRooms(); }); } }
    };
  });
}
document.getElementById("closeRoomsBtn").onclick=function(){ document.getElementById("roomsModal").style.display="none"; };
document.getElementById("showActiveBtn").onclick=function(){ showRoomsModal("🎯 الجيمات الشغالة", window.allGames.filter(g=>!g.gameEnded)); };
document.getElementById("showFinishedBtn").onclick=function(){ showRoomsModal("🏁 الجيمات المنتهية", window.allGames.filter(g=>g.gameEnded)); };

// الأحداث الأساسية
document.getElementById("startGameBtn").onclick=function(){
  const sel=document.querySelectorAll("#playerChoices input:checked"); players=Array.from(sel).map(chk=>({name:chk.value,scores:[],total:0,wins:0}));
  if(players.length===0){ showToast("اختر على الأقل لاعب واحد","warn"); return; }
  const gameName=document.getElementById("gameSelect").value; lastGameName=gameName+"_"+players.map(p=>p.name).join("_")+"_"+todayDateStr();
  currentGameId=sanitizeForKey(lastGameName); currentGameRef=gameRefById(currentGameId);
  roundCount=0; gameEnded=false; localScoresBuffer={};
  document.getElementById("game").style.display="block"; document.getElementById("gameName").textContent=lastGameName;
  renderPlayerChoices(); renderPlayersTable(); renderTopPlayers(); renderRounds(); saveToDB();
};

document.getElementById("addRoundBtn").onclick=function(){ roundCount++; players.forEach(p=>{ if(!Array.isArray(p.scores)) p.scores=[]; p.scores.push(0); }); renderRounds(); saveToDB(); };
document.getElementById("endGameBtn").onclick=function(){
  gameEnded=true;
  const maxScore=Math.max(...players.map(p=>p.total||0));
  players.filter(p=>p.total===maxScore).forEach(p=>{ const w=playersWins.find(x=>x.name===p.name); if(w) w.wins++; else playersWins.push({name:p.name,wins:1}); });
  renderWinsTable(); saveToDB(); showToast("تم إنهاء الجيم!","success");
};
document.getElementById("addPlayerBtn").onclick=function(){ const val=document.getElementById("newPlayerInput").value.trim(); if(val){ fixedPlayers.push(val); renderPlayerChoices(); document.getElementById("newPlayerInput").value=""; saveToDB(); } };
document.getElementById("addGameBtn").onclick=function(){ const val=document.getElementById("newGameInput").value.trim(); if(val){ const sel=document.getElementById("gameSelect"); const opt=document.createElement("option"); opt.textContent=val; sel.appendChild(opt); sel.value=val; document.getElementById("newGameInput").value=""; saveToDB(); } };
document.getElementById("clearWinsBtn").onclick=function(){ playersWins.forEach(p=>p.wins=0); renderWinsTable(); saveToDB(); showToast("تم مسح جميع الفوز","info"); };

// Firebase realtime
onValue(ref(db,"games"),snap=>{ refreshRooms(); if(currentGameId&&snap.hasChild(currentGameId)){ applySnapshotToLocal(snap.child(currentGameId).val()); } });
onValue(winsRef(),snap=>{ if(!snap.exists()) return; playersWins=Object.values(snap.val()||[]).map(x=>({name:x.name,wins:Number(x.wins)||0})); renderWinsTable(); });

function applySnapshotToLocal(obj){ if(!obj) return; players=obj.players||[]; fixedPlayers=obj.fixedPlayers||fixedPlayers; playersWins=obj.playersWins||playersWins; roundCount=obj.roundCount||0; gameEnded=obj.gameEnded||false; lastGameName=obj.gameName||lastGameName; document.getElementById("gameName").textContent=lastGameName; document.getElementById("game").style.display="block"; renderPlayerChoices(); renderPlayersTable(); renderTopPlayers(); renderRounds(); }
renderPlayerChoices();
</script>
</body>
</html>
