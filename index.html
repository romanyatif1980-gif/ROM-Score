<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎮 تسجيل السكورات - Martina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #fff8f0; color: #333; margin: 0; padding: 0; }
    header { background: #b8860b; color: #fff; padding: 15px; text-align: center; font-size: 1.5em; font-weight: bold; }
    section { padding: 20px; }
    label { display: block; margin-top: 10px; }
    input, button, select { padding: 8px; margin-top: 5px; width: 100%; max-width: 300px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0e68c; }
    .winner { background: #90ee90; }
    .btn-danger { background: #ff4d4d; color: #fff; border: none; cursor: pointer; }
    .btn-primary { background: #b8860b; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <header>🎮 تسجيل السكورات - Martina</header>
  <section>
    <h2>إضافة جيم جديد</h2>
    <label>اسم الجيم:
      <input type="text" id="gameName">
    </label>
    <button class="btn-primary" onclick="createGame()">إضافة الجيم</button>
  </section>

  <section>
    <h2>إدارة الجيمات</h2>
    <select id="gamesList" onchange="loadGame()">
      <option value="">اختر جيم</option>
    </select>
    <button class="btn-danger" onclick="deleteGame()">حذف الجيم (كلمة سر)</button>
  </section>

  <section>
    <h2>إضافة لاعبين</h2>
    <label>اسم اللاعب:
      <input type="text" id="playerName">
    </label>
    <button class="btn-primary" onclick="addPlayer()">إضافة لاعب</button>

    <h3>قائمة اللاعبين</h3>
    <ul id="playersList"></ul>
  </section>

  <section>
    <h2>تسجيل السكورات</h2>
    <table id="scoreTable">
      <thead>
        <tr>
          <th>اللاعب</th>
          <th>الجولة 1</th>
          <th>الجولة 2</th>
          <th>الجولة 3</th>
          <th>المجموع</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn-primary" onclick="calculateWinner()">اعرف الفائز</button>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    // ---------------- Firebase Config ----------------
    const firebaseConfig = {
      apiKey: "ضع_مفتاحك_هنا",
      authDomain: "ضع_المجال_هنا",
      databaseURL: "ضع_URL_القاعدة_هنا",
      projectId: "ضع_ID_المشروع_هنا",
      storageBucket: "ضع_التخزين_هنا",
      messagingSenderId: "ضع_ID_المرسل",
      appId: "ضع_APP_ID_هنا"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentGame = null;
    let players = [];

    function createGame() {
      const name = document.getElementById("gameName").value.trim();
      if (!name) return alert("ادخل اسم الجيم");
      const gameId = "game_" + Date.now();
      db.ref("games/" + gameId).set({ name, createdAt: Date.now() });
      loadGames();
      document.getElementById("gameName").value = "";
    }

    function loadGames() {
      const select = document.getElementById("gamesList");
      select.innerHTML = '<option value="">اختر جيم</option>';
      db.ref("games").once("value", snapshot => {
        snapshot.forEach(child => {
          const opt = document.createElement("option");
          opt.value = child.key;
          opt.textContent = child.val().name;
          select.appendChild(opt);
        });
      });
    }

    function loadGame() {
      const gameId = document.getElementById("gamesList").value;
      if (!gameId) return;
      currentGame = gameId;
      db.ref("games/" + gameId + "/players").once("value", snapshot => {
        players = [];
        document.getElementById("playersList").innerHTML = "";
        snapshot.forEach(child => {
          players.push({ name: child.val().name, scores: child.val().scores || [0,0,0] });
          renderPlayers();
        });
      });
      renderScoreTable();
    }

    function addPlayer() {
      if (!currentGame) return alert("اختر جيم أولاً");
      const name = document.getElementById("playerName").value.trim();
      if (!name) return alert("ادخل اسم اللاعب");
      const playerId = "player_" + Date.now();
      db.ref("games/" + currentGame + "/players/" + playerId).set({ name, scores: [0,0,0] });
      document.getElementById("playerName").value = "";
      loadGame();
    }

    function renderPlayers() {
      const ul = document.getElementById("playersList");
      ul.innerHTML = "";
      players.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.name;
        ul.appendChild(li);
      });
      renderScoreTable();
    }

    function renderScoreTable() {
      const tbody = document.getElementById("scoreTable").querySelector("tbody");
      tbody.innerHTML = "";
      players.forEach((p, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.name}</td>
          <td><input type="number" value="${p.scores[0]}" onchange="updateScore(${idx},0,this.value)"></td>
          <td><input type="number" value="${p.scores[1]}" onchange="updateScore(${idx},1,this.value)"></td>
          <td><input type="number" value="${p.scores[2]}" onchange="updateScore(${idx},2,this.value)"></td>
          <td>${p.scores.reduce((a,b)=>a+b,0)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateScore(playerIdx, roundIdx, value) {
      players[playerIdx].scores[roundIdx] = Number(value);
      renderScoreTable();
      if (currentGame) {
        const playerKeys = Object.keys(playersMap());
        db.ref("games/" + currentGame + "/players/" + playerKeys[playerIdx] + "/scores").set(players[playerIdx].scores);
      }
    }

    function calculateWinner() {
      if (!players.length) return;
      let maxScore = Math.max(...players.map(p => p.scores.reduce((a,b)=>a+b,0)));
      const tbody = document.getElementById("scoreTable").querySelector("tbody");
      Array.from(tbody.children).forEach((tr, idx) => {
        const total = players[idx].scores.reduce((a,b)=>a+b,0);
        if (total === maxScore) tr.classList.add("winner");
        else tr.classList.remove("winner");
      });
    }

    function playersMap() {
      const map = {};
      db.ref("games/" + currentGame + "/players").once("value", snapshot => {
        snapshot.forEach(child => { map[child.key] = child.val(); });
      });
      return map;
    }

    function deleteGame() {
      const password = prompt("ادخل كلمة السر لحذف الجيم");
      if (password !== "1234") return alert("كلمة السر خاطئة");
      const gameId = document.getElementById("gamesList").value;
      if (!gameId) return alert("اختر جيم أولاً");
      db.ref("games/" + gameId).remove();
      loadGames();
      players = [];
      renderPlayers();
    }

    // ---------------- Initial Load ----------------
    loadGames();
  </script>
</body>
</html>
