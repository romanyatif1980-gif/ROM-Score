<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎮 تسجيل السكورات</title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .setup, .game, .wins { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin: 20px auto; max-width: 900px; }
    input, select, button { padding: 7px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { cursor: pointer; font-weight: bold; }
    .start { background: #4caf50; color: white; }
    .add { background: #2196f3; color: white; }
    .top-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 150px; text-align: center; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; padding: 5px; text-align: center; }
    .buttons { margin: 20px 0; text-align: center; }
    .buttons button { margin: 5px; padding: 10px 15px; border: none; border-radius: 8px; }
    .end { background: #f44336; color: white; }
    .edit-small { background: #ff9800; color: white; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
    .modal {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.4); z-index: 9999;
    }
    .modal .box {
      width: 90%; max-width: 700px; background: white; padding: 20px; border-radius: 10px; text-align: right;
      max-height: 80vh; overflow:auto;
    }
    .game-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee;}
  </style>
</head>
<body>
  <h1>🎮 تسجيل السكورات</h1>

  <div class="setup" id="setup">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎲 اختر اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>لعبة الورق</option>
    </select>
    <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
    <button id="addGameBtn" class="add">➕ إضافة لعبة</button>
    <button id="showGamesBtnTop" class="add">📋 عرض الجيمات الشغالة</button>

    <hr>

    <h3>👥 اختر اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

    <br>
    <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
  </div>

  <div class="game" id="game" style="display:none;">
    <h2 id="gameName"></h2>
    <div class="top-players" id="topPlayers"></div>
    <table id="playersTable">
      <thead>
        <tr><th>اللاعب</th><th>المجموع</th></tr>
      </thead>
      <tbody id="playersBody"></tbody>
    </table>

    <h2 style="margin-top:40px;">📊 جدول الجولات</h2>
    <div class="buttons">
      <button id="addRoundBtn" class="add">➕ إضافة جولة جديدة</button>
      <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
    </div>
    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div class="wins" id="winsTable">
    <h2>🏆 ترتيب اللاعبين حسب عدد الفوز</h2>
    <table>
      <thead>
        <tr><th>اللاعب</th><th>عدد الفوز</th></tr>
      </thead>
      <tbody id="winsBody"></tbody>
    </table>
    <div style="text-align:center; margin-top:12px;">
      <button id="showGamesBtnBottom" class="add">📋 عرض الجيمات الشغالة</button>
    </div>
  </div>

  <div id="gamesModal" class="modal">
    <div class="box">
      <h3 style="margin-top:0;">📋 الجيمات الشغالة</h3>
      <div id="activeGamesList">جاري التحميل...</div>
      <div style="text-align:left; margin-top:12px;">
        <button id="closeGamesModal" class="start">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- ====== Firebase initializer (مستقر وواضح، يجب أن يُحمّل قبل السكربت الرئيسي) ====== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.firebasestorage.app",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // نعرّض دوال مساعدة بسيطة تحت window.firebaseHelper
    window.firebaseHelper = {
      // set(path, value) => يكتب القيمة في المسار
      set: (path, value) => set(ref(db, path), value),
      // update(path, value) => يعمل update على المسار (لو value مش object، يخزنه تحت المفتاح 'value')
      update: (path, value) => {
        if (typeof value === 'object' && value !== null) {
          return update(ref(db, path), value);
        } else {
          // لو القيمة بسيطة، نكتب ككائن صغير
          return update(ref(db, path), { value: value });
        }
      },
      // onValue(path, callback) => يبدأ الاستماع ويرجع دالة لإلغاء الاشتراك
      onValue: (path, callback) => {
        const r = ref(db, path);
        const unsub = onValue(r, (snap) => {
          callback(snap.val());
        });
        // onValue في الـmodular API ترجع دالة إلغاء الاشتراك، فنرجعها
        return unsub;
      },
      // جلب الجيمات الشغالة من /games
      getActiveGames: async () => {
        const rootRef = ref(db, 'games');
        const snapshot = await get(rootRef);
        const val = snapshot.val();
        const list = [];
        if (!val) return list;
        Object.keys(val).forEach(gameName => {
          const instances = val[gameName];
          if (!instances) return;
          Object.keys(instances).forEach(instId => {
            const inst = instances[instId];
            if (inst && inst.status === 'active') {
              list.push({ gameName, instanceId: instId, createdAt: inst.createdAt || 0 });
            }
          });
        });
        return list;
      },
      dbInstance: db
    };
  </script>

  <!-- ====== السكربت الرئيسي (اللي فيه منطق الصفحة كما في كودك الأصلي) ====== -->
  <script>
    let fixedPlayers = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    let players = [];
    let playersWins = [];
    let roundCount = 0;
    let gameEnded = false;
    let editableRound = null;

    // Firebase-related variables (set later)
    let db = null;
    let currentGameName = "";
    let currentInstanceId = "";
    let currentGameRef = null;
    let currentGameUnsub = null;

    function renderPlayerChoices() {
      const container = document.getElementById("playerChoices");
      container.innerHTML = "";
      fixedPlayers.forEach(name => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = name;
        label.appendChild(checkbox);
        label.append(" " + name + " ");
        container.appendChild(label);
      });
    }

    function addPlayer() {
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if(name) {
        fixedPlayers.push(name);
        renderPlayerChoices();
        input.value = "";
      }
    }

    function addGame() {
      const input = document.getElementById("newGameInput");
      const name = input.value.trim();
      if(name) {
        const select = document.getElementById("gameSelect");
        const option = document.createElement("option");
        option.textContent = name;
        select.appendChild(option);
        select.value = name;
        input.value = "";
      }
    }

    function startGame() {
      const gameSelect = document.getElementById("gameSelect");
      const gameName = gameSelect.value;
      document.getElementById("gameName").textContent = "🎲 اللعبة: " + gameName;

      players = [];
      document.querySelectorAll("#playerChoices input:checked").forEach(chk => {
        let existing = playersWins.find(p => p.name === chk.value);
        if(existing){
          players.push({ name: chk.value, total: 0, scores: [], wins: existing.wins });
        } else {
          players.push({ name: chk.value, total: 0, scores: [], wins: 0 });
          playersWins.push({ name: chk.value, wins: 0 });
        }
      });

      if(players.length < 2) {
        alert("لازم تختار على الأقل لاعبين!");
        return;
      }

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";

      document.querySelectorAll(".add, .end, .edit-small").forEach(btn => btn.disabled = false);

      renderTopPlayers();
      renderPlayersTable();
      renderRounds();

      // Firebase: create an instance for this device/session and start syncing
      currentGameName = gameName;
      currentInstanceId = generateInstanceId();
      if (window.firebaseHelper && window.firebaseHelper.set) {
        currentGameRef = `games/${currentGameName}/${currentInstanceId}`;
        const data = {
          players: players,
          roundCount: roundCount,
          gameEnded: gameEnded,
          playersWins: playersWins,
          status: "active",
          createdAt: Date.now()
        };
        // حفظ أولي في Firebase
        setInFirebase(currentGameRef, data).catch(err => console.error("Firebase set error:", err));
        // بدأ الاستماع للتحديثات
        currentGameUnsub = listenToFirebaseInstance(currentGameRef);
      } else {
        console.warn("Firebase غير متاح الآن — ستعمل محلياً فقط.");
      }
    }

    function renderTopPlayers() {
      const topDiv = document.getElementById("topPlayers");
      topDiv.innerHTML = "";
      const filtered = players.filter(p => p.total > 0);
      filtered.sort((a,b) => b.total - a.total);
      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `${p.name}<br>⭐ ${p.total}`;
        topDiv.appendChild(card);
      });
    }

    function renderPlayersTable() {
      const body = document.getElementById("playersBody");
      body.innerHTML = "";
      players.slice().sort((a,b)=> b.total - a.total).forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.name}</td><td>${p.total}</td>`;
        body.appendChild(row);
      });
    }

    function renderRounds() {
      const head = document.getElementById("roundsHead");
      const body = document.getElementById("roundsBody");

      let headHTML = "<tr><th>الجولة</th>";
      players.forEach(p => { headHTML += `<th>${p.name}</th>`; });
      headHTML += "<th>تعديل</th></tr>";
      head.innerHTML = headHTML;

      let totalRow = "<tr style='background:#eee; font-weight:bold;'><td>المجموع</td>";
      players.forEach(p => { totalRow += `<td>${p.total}</td>`; });
      totalRow += "<td>-</td></tr>";
      body.innerHTML = totalRow;

      for (let r=roundCount-1; r>=0; r--) {
        let row = `<tr><td>جولة ${r+1}</td>`;
        players.forEach((p,i) => {
          const val = p.scores[r] !== undefined ? p.scores[r] : "";
          const disabled = (editableRound === r && !gameEnded) ? "" : "disabled";
          row += `<td><input type="number" value="${val}" onchange="updateScore(${i},${r},this.value)" ${disabled}></td>`;
        });
        row += `<td><button class="edit-small" onclick="editRound(${r})" ${gameEnded ? "disabled" : ""}>✏️</button></td>`;
        row += "</tr>";
        body.innerHTML += row;
      }
    }

    function addRound() {
      if(gameEnded) return;
      roundCount++;
      editableRound = roundCount-1;
      renderRounds();

      if (window.firebaseHelper && currentGameRef) {
        updateInFirebase(`${currentGameRef}/roundCount`, roundCount).catch(err => console.error("Firebase update error:", err));
      }
    }

    function editRound(r) {
      if(gameEnded) return;
      editableRound = r;
      renderRounds();
      alert("ممكن تعدل جولة " + (r+1));
    }

    function updateScore(playerIndex, roundIndex, value) {
      players[playerIndex].scores[roundIndex] = Number(value);
      players[playerIndex].total = players[playerIndex].scores.reduce((a,b)=>a+(b||0),0);
      renderTopPlayers();
      renderPlayersTable();
      renderRounds();

      if (window.firebaseHelper && currentGameRef) {
        setInFirebase(`${currentGameRef}/players/${playerIndex}`, players[playerIndex]).catch(err => console.error("Firebase set error:", err));
      }
    }

    function endGame() {
      gameEnded = true;
      editableRound = null;
      renderRounds();
      document.querySelectorAll(".add, .end, .edit-small").forEach(btn => btn.disabled = true);

      let winner = players.reduce((prev, curr) => (curr.total > prev.total ? curr : prev), players[0]);
      if(winner){
        winner.wins++;
        let found = playersWins.find(p => p.name === winner.name);
        if(found) found.wins = winner.wins;
      }

      renderPlayersTable();
      renderWinsTable();

      const gameDiv = document.getElementById("game");
      const newBtn = document.createElement("button");
      newBtn.textContent = "🔄 جيم جديد";
      newBtn.className = "start";
      newBtn.addEventListener('click', newGame);
      gameDiv.appendChild(newBtn);

      alert("تم إنهاء الجيم ✅ الفائز: " + winner.name);

      if (window.firebaseHelper && currentGameRef) {
        const data = {
          players: players,
          gameEnded: true,
          playersWins: playersWins,
          status: "finished",
          finishedAt: Date.now()
        };
        setInFirebase(currentGameRef, data).catch(err => console.error("Firebase set error:", err));
        // تحديث wins لكل لاعب
        players.forEach(p => {
          setInFirebase(`wins/${p.name}`, { wins: p.wins }).catch(err => console.error("Firebase set error:", err));
        });
      }
    }

    function newGame() {
      players = [];
      roundCount = 0;
      gameEnded = false;
      editableRound = null;

      document.getElementById("setup").style.display = "block";
      document.getElementById("game").style.display = "none";

      document.getElementById("topPlayers").innerHTML = "";
      document.getElementById("playersBody").innerHTML = "";
      document.getElementById("roundsHead").innerHTML = "";
      document.getElementById("roundsBody").innerHTML = "";
      document.getElementById("gameName").textContent = "";

      const gameDiv = document.getElementById("game");
      const newBtn = gameDiv.querySelector("button.start");
      if(newBtn) newBtn.remove();

      if (window.firebaseHelper && currentGameRef) {
        updateInFirebase(`${currentGameRef}/status`, "finished").catch(()=>{});
        if (currentGameUnsub) try { currentGameUnsub(); } catch(e){}
        currentGameRef = null;
        currentGameUnsub = null;
      }

      renderPlayerChoices();
    }

    function renderWinsTable() {
      const body = document.getElementById("winsBody");
      body.innerHTML = "";
      playersWins.slice().sort((a,b)=>b.wins - a.wins).forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.name}</td><td>${p.wins}</td>`;
        body.appendChild(row);
      });
    }

    // Firebase helper shims that call window.firebaseHelper
    function generateInstanceId() {
      return (Math.random().toString(36).substring(2,8) + "-" + Date.now().toString(36));
    }
    function setInFirebase(path, value) {
      if (!window.firebaseHelper || !window.firebaseHelper.set) return Promise.reject("Firebase غير متاح");
      return window.firebaseHelper.set(path, value);
    }
    function updateInFirebase(path, value) {
      if (!window.firebaseHelper || !window.firebaseHelper.update) return Promise.reject("Firebase غير متاح");
      return window.firebaseHelper.update(path, value);
    }
    function listenToFirebaseInstance(path) {
      if (!window.firebaseHelper || !window.firebaseHelper.onValue) {
        console.warn("Firebase onValue غير متاح");
        return null;
      }
      // إلغاء أي استماع سابق
      if (currentGameUnsub) {
        try { currentGameUnsub(); } catch(e){}
        currentGameUnsub = null;
      }
      // الاشتراك في التحديثات اللحظية للمسار المحدد
      const unsub = window.firebaseHelper.onValue(path, (data) => {
        if (!data) return;
        players = data.players || players;
        roundCount = data.roundCount || roundCount;
        gameEnded = (typeof data.gameEnded !== 'undefined') ? data.gameEnded : gameEnded;
        playersWins = data.playersWins || playersWins;
        renderTopPlayers();
        renderPlayersTable();
        renderRounds();
        renderWinsTable();
      });
      currentGameUnsub = unsub || null;
      return unsub || null;
    }

    function loadActiveGamesAndShow() {
      if (!window.firebaseHelper || !window.firebaseHelper.getActiveGames) {
        document.getElementById("activeGamesList").innerText = "Firebase غير متصل الآن.";
        document.getElementById("gamesModal").style.display = "flex";
        return;
      }
      document.getElementById("activeGamesList").innerHTML = "جاري التحميل...";
      window.firebaseHelper.getActiveGames().then(list => {
        const container = document.getElementById("activeGamesList");
        container.innerHTML = "";
        if (!list || list.length === 0) {
          container.innerHTML = "<div>لا توجد جيمات شغالة حالياً.</div>";
        } else {
          list.forEach(item => {
            const div = document.createElement("div");
            div.className = "game-item";
            const left = document.createElement("div");
            left.innerText = `${item.gameName} — ${item.instanceId}`;
            const right = document.createElement("div");
            const joinBtn = document.createElement("button");
            joinBtn.className = "start";
            joinBtn.textContent = "انضم";
            joinBtn.onclick = () => {
              currentGameName = item.gameName;
              currentInstanceId = item.instanceId;
              currentGameRef = `games/${currentGameName}/${currentInstanceId}`;
              document.getElementById("setup").style.display = "none";
              document.getElementById("game").style.display = "block";
              document.getElementById("gameName").textContent = "🎲 اللعبة: " + currentGameName + " — " + currentInstanceId;
              listenToFirebaseInstance(currentGameRef);
              document.getElementById("gamesModal").style.display = "none";
            };
            right.appendChild(joinBtn);
            div.appendChild(left);
            div.appendChild(right);
            container.appendChild(div);
          });
        }
        document.getElementById("gamesModal").style.display = "flex";
      }).catch(err => {
        document.getElementById("activeGamesList").innerText = "فشل تحميل الجيمات: " + err;
        document.getElementById("gamesModal").style.display = "flex";
      });
    }

    window.addEventListener('DOMContentLoaded', (event) => {
      renderPlayerChoices();
      renderWinsTable();
      document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
      document.getElementById('addGameBtn').addEventListener('click', addGame);
      document.getElementById('startGameBtn').addEventListener('click', startGame);
      document.getElementById('addRoundBtn').addEventListener('click', addRound);
      document.getElementById('endGameBtn').addEventListener('click', endGame);
      document.getElementById('showGamesBtnTop').addEventListener('click', loadActiveGamesAndShow);
      document.getElementById('showGamesBtnBottom').addEventListener('click', loadActiveGamesAndShow);
      document.getElementById('closeGamesModal').addEventListener('click', () => {
        document.getElementById('gamesModal').style.display = 'none';
      });
      // expose updateScore & editRound globally (they already are as functions) so inline onchange / onclick works
      window.updateScore = updateScore;
      window.editRound = editRound;
    });
  </script>
</body>
</html>
