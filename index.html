<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>🎮 تسجيل السكورات (Live - Firebase)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .top-controls { text-align:center; margin-bottom:10px; }
    .setup, .game, .wins {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin: 20px auto;
      max-width: 900px;
    }
    input, select, button { padding: 7px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { cursor: pointer; font-weight: bold; }
    .start { background: #4caf50; color: white; }
    .add { background: #2196f3; color: white; }
    .top-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
    .card {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 150px;
      text-align: center;
      font-weight: bold;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; padding: 5px; text-align: center; }
    .buttons { margin: 20px 0; text-align: center; }
    .buttons button { margin: 5px; padding: 10px 15px; border: none; border-radius: 8px; }
    .end { background: #f44336; color: white; }
    .back { background:#e0e0e0; color:#111; margin-left:8px; }
    .edit-small { background: #ff9800; color: white; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
    .small { font-size: 12px; padding: 6px 10px; border-radius: 6px; }
    .delete-small { font-size: 12px; padding: 3px 6px; border-radius: 6px; background: #f44336; color: white; margin-left: 5px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal { background: white; padding: 16px; border-radius: 10px; width: 90%; max-width: 700px; max-height: 70vh; overflow: auto; }
    .game-row { display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee; }
    .game-title { font-weight: bold; }
    .muted { color: #666; font-size: 13px; }
    .hint { font-size: 13px; color: #444; text-align: center; margin-bottom: 8px; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    .rooms-list div { margin-bottom: 8px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 220px;
      max-width: 90vw;
      padding: 10px 14px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      font-weight: bold;
      text-align: center;
      opacity: 0;
      transform: translateY(-6px);
      animation: toast-in 300ms forwards;
    }
    .toast.success { background: #4caf50; }
    .toast.info { background: #2196f3; }
    .toast.warn { background: #f44336; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toast-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
  </style>
</head>
<body>
  <h1>🎮 تسجيل السكورات</h1>

  <div class="top-controls">
    <button id="showActiveBtn" class="small">🎯 عرض الجيمات الشغالة</button>
    <button id="showFinishedBtn" class="small">🏁 عرض الجيمات المنتهية</button>
  </div>

  <div class="setup" id="setup">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎲 اختر اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>لعبة الورق</option>
    </select>
    <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
    <button id="addGameBtn" class="add">➕ إضافة لعبة</button>

    <hr>

    <h3>👥 اختر اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

    <div class="hint">اختار لاعبين ثم اضغط "ابدأ الجيم" — سيُنشأ جيم باسم: <code>اللعبة_اللاعب1_اللاعب2_..._YYYY-MM-DD_NN</code></div>

    <br>
    <div style="margin-top:10px;">
      <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
      <button id="clearWinsBtn" class="small" style="background:#e0e0e0;">🗑️ مسح بيانات الفوز</button>
    </div>
  </div>

  <div class="game" id="game" style="display:none;">
    <h2 id="gameName"></h2>
    <div class="top-players" id="topPlayers"></div>
    <table id="playersTable">
      <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>

    <h2 style="margin-top:40px;">📊 جدول الجولات</h2>
    <div class="buttons">
      <button id="addRoundBtn" class="add">➕ إضافة جولة جديدة</button>
      <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
      <button id="backBtn" class="back">رجوع</button>
    </div>
    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div class="wins" id="winsTable">
    <h2>🏆 ترتيب اللاعبين حسب عدد الفوز (مع إجمالي النقاط)</h2>
    <table>
      <thead><tr><th>اللاعب</th><th>عدد الفوز</th><th>إجمالي النقاط</th></tr></thead>
      <tbody id="winsBody"></tbody>
    </table>
  </div>

  <div id="roomsModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h3 id="roomsModalTitle">🎮 الجيمات</h3>
      <div id="roomsList" style="margin-top:8px;" class="rooms-list"></div>
      <div style="text-align:center; margin-top:12px;">
        <button id="closeRoomsBtn" class="small">إغلاق</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-hidden="true"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, remove, runTransaction, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.firebasestorage.app",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ADMIN_PASSWORD = "112233";

    function makeId(len=8){ const chars='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
    const CLIENT_ID = (localStorage.getItem('rom_client_id') || makeId(10));
    try{ localStorage.setItem('rom_client_id', CLIENT_ID); } catch(e){}

    const DEFAULT_FIXED_PLAYERS = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    let fixedPlayers = DEFAULT_FIXED_PLAYERS.slice();
    let players = [];
    let playersWins = [];
    let playersWinsWithPoints = [];
    let roundCount = 0;
    let gameEnded = false;
    let editableRound = null;
    let lastGameName = "";
    let currentGameId = null;
    let currentGameRef = null;
    let currentUnsubscribe = null;
    let applyingRemote = false;

    let isUserEditing = false;
    let localScoresBuffer = {};
    let editLock = {};
    let saveTimer = null;
    let lastLocalSaveMeta = { saveId: null, timestamp: 0 };

    function isText(x){ return typeof x === 'string' && x.trim().length > 0; }
    function sanitizeForKey(name) { return isText(name)?name.replace(/[.#$\[\]\/]/g, '_').trim():"player"; }
    function todayDateStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function gameRefById(id) { return ref(db, `games/${id}`); }
    function winsRef() { return ref(db, `playersWins`); }
    function metaRef() { return ref(db, `meta`); }

    function recalcTotalsLocal() {
      players.forEach(p => {
        if(!Array.isArray(p.scores)) p.scores=[];
        p.total = p.scores.reduce((a,b)=> a + (Number.isFinite(b) ? b : 0), 0);
      });
    }

    function resetLocalEditingState(){
      localScoresBuffer = {};
      editLock = {};
      lastLocalSaveMeta = { saveId: null, timestamp: 0 };
      isUserEditing = false;
    }

    function renderPlayerChoices() {
      const container = document.getElementById("playerChoices");
      container.innerHTML = "";
      fixedPlayers.forEach(name=>{
        const checked = players.find(p=>p.name===name)?'checked':"";
        const el = document.createElement("div");
        el.innerHTML = `<label><input type="checkbox" value="${name}" ${checked}> ${name}</label>`;
        container.appendChild(el);
      });
    }

    function renderTopPlayers() {
      const container = document.getElementById("topPlayers");
      container.innerHTML="";
      const sorted = [...players].sort((a,b)=>b.total - a.total);
      sorted.slice(0,4).forEach(p=>{
        const div = document.createElement("div");
        div.className="card";
        div.textContent=`${p.name}: ${p.total || 0}`;
        container.appendChild(div);
      });
    }

    function renderPlayersTable() {
      const tbody = document.getElementById("playersBody");
      tbody.innerHTML="";
      players.forEach(p=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`<td>${p.name}</td><td>${p.total || 0}</td>`;
        tbody.appendChild(tr);
      });
    }

    function renderWinsTable() {
      const tbody = document.getElementById("winsBody");
      tbody.innerHTML = "";
      const sorted = [...playersWinsWithPoints].sort((a,b)=> {
        if (b.wins !== a.wins) return b.wins - a.wins;
        return (b.totalPoints||0) - (a.totalPoints||0);
      });
      sorted.forEach(p=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${p.name}</td><td>${p.wins}</td><td>${p.totalPoints || 0}</td>`;
        tbody.appendChild(tr);
      });
    }

    async function refreshWinsAndTotals() {
      try {
        const snapWins = await get(winsRef());
        const winsVal = snapWins.val() || {};
        const winsMap = {};
        Object.keys(winsVal).forEach(k => {
          const entry = winsVal[k];
          if (entry === null || entry === undefined) return;
          if (typeof entry === 'number') winsMap[k] = Number(entry) || 0;
          else if (typeof entry === 'object') winsMap[k] = Number(entry.wins) || 0;
        });

        const gamesSnap = await get(ref(db, 'games'));
        const gamesVal = gamesSnap.val() || {};
        const pointsMap = {};
        Object.keys(gamesVal).forEach(gid => {
          const g = gamesVal[gid];
          if (!g || !Array.isArray(g.players)) return;
          g.players.forEach(p => {
            if (!p || !p.name) return;
            const nm = p.name;
            const tot = Number(p.total) || 0;
            pointsMap[nm] = (pointsMap[nm] || 0) + tot;
          });
        });

        const uniqNames = new Set([...Object.keys(winsMap), ...Object.keys(pointsMap)]);
        playersWinsWithPoints = Array.from(uniqNames).map(nm => ({ name: nm, wins: winsMap[nm] || 0, totalPoints: pointsMap[nm] || 0 }));
        renderWinsTable();
      } catch (e) {
        console.error("refreshWinsAndTotals error:", e);
      }
    }

    function applyLocalBufferToPlayersArray(playersArray) {
      if(!Array.isArray(playersArray)) return playersArray;
      const cloned = playersArray.map(p => {
        if(!p || typeof p !== 'object') return null;
        const name = isText(p.name) ? p.name : null;
        if(!name) return null;
        const scores = Array.isArray(p.scores) ? p.scores.slice() : [];
        return { name, scores, total: p.total || 0, wins: p.wins || 0 };
      }).filter(Boolean);

      Object.keys(localScoresBuffer).forEach(key=>{
        const [piStr, riStr] = key.split('_');
        const pi = Number(piStr), ri = Number(riStr);
        if(!Number.isFinite(pi) || !Number.isFinite(ri)) return;
        if(!cloned[pi]) return;
        while (cloned[pi].scores.length <= ri) cloned[pi].scores.push(null);
        cloned[pi].scores[ri] = localScoresBuffer[key];
      });

      cloned.forEach(p=>{ p.total = Array.isArray(p.scores) ? p.scores.reduce((a,b)=>a+(Number.isFinite(b)?b:0),0) : 0; });
      return cloned;
    }

    function mergeSnapshotWithLocalBuffer(snapVal) {
      const merged = { ...snapVal };
      if (!Array.isArray(snapVal.players)) return merged;
      merged.players = applyLocalBufferToPlayersArray(snapVal.players);
      if(Array.isArray(snapVal.playersWins)){
        const tmp=snapVal.playersWins.filter(x=>x&&isText(x.name)).map(x=>({name:x.name,wins:Number.isInteger(x.wins)?x.wins:(Number(x.wins)||0)}));
        const map={}; tmp.forEach(w=>map[w.name]=(map[w.name]||0)+(w.wins||0));
        merged.playersWins = Object.keys(map).map(n=>({name:n,wins:map[n]}));
      }
      return merged;
    }

    function applySnapshotToLocal(snapVal) {
      if(!snapVal) return;
      try {
        const snapLastBy = snapVal.lastModifiedBy || null;
        const snapLastStamp = Number(snapVal.lastUpdate || 0);
        const snapSaveId = snapVal.saveId || null;
        if (snapLastBy === CLIENT_ID && snapSaveId && snapSaveId === lastLocalSaveMeta.saveId && snapLastStamp === lastLocalSaveMeta.timestamp) {
          refreshWinsAndTotals();
          return;
        }
      } catch(e){}

      applyingRemote = true;
      try {
        const remotePlayers = Array.isArray(snapVal.players) ? snapVal.players.slice() : [];
        const mergedPlayers = [];
        const maxLen = Math.max(remotePlayers.length, players.length);
        for (let pi = 0; pi < maxLen; pi++) {
          const rp = remotePlayers[pi] || {};
          const localP = players[pi] || {};
          const name = isText(rp.name) ? rp.name : (isText(localP.name) ? localP.name : (`player_${pi}`));
          const scoresRemote = Array.isArray(rp.scores) ? rp.scores.slice() : [];
          const scoresLocal = Array.isArray(localP.scores) ? localP.scores.slice() : [];
          const maxRounds = Math.max(scoresRemote.length, scoresLocal.length);
          const finalScores = [];
          for (let ri = 0; ri < maxRounds; ri++) {
            const key = `${pi}_${ri}`;
            if (Object.prototype.hasOwnProperty.call(editLock, key) && editLock[key]) {
              if (Object.prototype.hasOwnProperty.call(localScoresBuffer, key)) finalScores[ri] = localScoresBuffer[key];
              else if (scoresLocal[ri] !== undefined && scoresLocal[ri] !== null) { const ln = Number(scoresLocal[ri]); finalScores[ri] = Number.isFinite(ln) ? ln : null; }
              else finalScores[ri] = null;
            } else {
              if (ri < scoresRemote.length && scoresRemote[ri] !== undefined && scoresRemote[ri] !== null) { const rn = Number(scoresRemote[ri]); finalScores[ri] = Number.isFinite(rn) ? rn : null; }
              else if (ri < scoresLocal.length && scoresLocal[ri] !== undefined && scoresLocal[ri] !== null) { const ln = Number(scoresLocal[ri]); finalScores[ri] = Number.isFinite(ln) ? ln : null; }
              else finalScores[ri] = null;
            }
          }
          const total = finalScores.reduce((a,b)=> a + (Number.isFinite(b) ? b : 0), 0);
          const winsVal = (rp && rp.wins) ? (Number.isFinite(Number(rp.wins)) ? Number(rp.wins) : 0) : ((localP && Number.isFinite(Number(localP.wins))) ? Number(localP.wins) : 0);
          mergedPlayers[pi] = { name, scores: finalScores, total, wins: winsVal };
        }

        players = mergedPlayers.filter(Boolean);
        recalcTotalsLocal();
        roundCount = Math.max(0, ...players.map(p => Array.isArray(p.scores) ? p.scores.length : 0));
        gameEnded = Boolean(snapVal.gameEnded) || gameEnded;
        editableRound = (snapVal.editableRound === null || Number.isInteger(snapVal.editableRound)) ? snapVal.editableRound : editableRound;
        lastGameName = isText(snapVal.gameName) ? snapVal.gameName : lastGameName;
      } finally {
        document.getElementById("setup").style.display = "none";
        document.getElementById("game").style.display = "block";
        document.getElementById("gameName").textContent = "🎲 اللعبة: " + (lastGameName || currentGameId || "");
        document.getElementById("addRoundBtn").disabled = !!gameEnded;
        document.getElementById("endGameBtn").disabled = !!gameEnded;
        renderPlayerChoices(); renderTopPlayers(); renderPlayersTable(); renderRounds();
        applyingRemote=false;
        refreshWinsAndTotals();
      }
    }

    function attachWinsListener() {
      onValue(winsRef(), (snap)=>{ refreshWinsAndTotals(); }, err=>console.error("wins onValue error:", err));
    }

    function attachListenerToGame(gameId) {
      resetLocalEditingState();
      if(currentUnsubscribe){try{currentUnsubscribe();}catch(e){} currentUnsubscribe=null;}
      currentGameId=gameId;
      currentGameRef=gameRefById(gameId);
      try{localStorage.setItem('currentGameId',currentGameId);}catch(e){}
      const unsub = onValue(currentGameRef,(snap)=>{
        const val = snap.val();
        if(!val){
          players=[]; roundCount=0; gameEnded=false; editableRound=null; lastGameName="";
          document.getElementById("setup").style.display="block";
          document.getElementById("game").style.display="none";
          document.getElementById("addRoundBtn").disabled = false;
          document.getElementById("endGameBtn").disabled = false;
          renderPlayerChoices(); renderPlayersTable(); renderRounds(); refreshWinsAndTotals();
          return;
        }

        if (Object.keys(editLock).length > 0) {
          try { window._pendingRemoteSnapshot = val; } catch(e){}
          if (window._pendingSnapshotTimer) clearTimeout(window._pendingSnapshotTimer);
          window._pendingSnapshotTimer = setTimeout(()=>{
            if (Object.keys(editLock).length === 0) {
              applySnapshotToLocal(window._pendingRemoteSnapshot);
              window._pendingRemoteSnapshot = null;
            } else {
              if (window._pendingSnapshotTimer) clearTimeout(window._pendingSnapshotTimer);
              window._pendingSnapshotTimer = setTimeout(()=>{ if(Object.keys(editLock).length===0){ applySnapshotToLocal(window._pendingRemoteSnapshot); window._pendingRemoteSnapshot=null;} }, 300);
            }
          }, 250);
        } else {
          applySnapshotToLocal(val);
        }

      }, err=>console.error("onValue error:",err));
      currentUnsubscribe = ()=>{ try{ unsub(); }catch(e){} };
    }

    async function saveToDB(setStatusBasedOnGameEnded=true) {
      if(applyingRemote) return;
      if(!currentGameId || !currentGameRef) return;
      recalcTotalsLocal();

      const localPlayersForMerge = players.map(p=>{
        const safeScores = Array.isArray(p.scores) ? p.scores.map(s => (Number.isFinite(s) ? s : null)) : [];
        return {...p, scores: safeScores, total: p.total || 0};
      });

      const saveId = `${CLIENT_ID}_${Date.now()}_${Math.floor(Math.random()*10000)}`;
      const payloadMeta = {
        fixedPlayers,
        roundCount,
        gameEnded,
        editableRound,
        gameName: lastGameName,
        lastUpdate: Date.now(),
        lastModifiedBy: CLIENT_ID,
        saveId
      };

      try {
        await runTransaction(currentGameRef, (current) => {
          const base = current && typeof current === 'object' ? {...current} : {};
          const remotePlayers = Array.isArray(base.players) ? base.players.slice() : [];
          const mergedPlayers = [];

          const maxPlayers = Math.max(remotePlayers.length, localPlayersForMerge.length);
          for (let idx = 0; idx < maxPlayers; idx++) {
            const rp = remotePlayers[idx] || {};
            const lp = localPlayersForMerge[idx] || {};
            const name = isText(rp.name) ? rp.name : (isText(lp.name) ? lp.name : (`player_${idx}`));
            const scoresRemote = Array.isArray(rp.scores) ? rp.scores.slice() : [];
            const scoresLocal = Array.isArray(lp.scores) ? lp.scores.slice() : [];
            const maxLen = Math.max(scoresRemote.length, scoresLocal.length);
            const finalScores = [];
            for (let i = 0; i < maxLen; i++) {
              const bufKey = `${idx}_${i}`;
              if (Object.prototype.hasOwnProperty.call(localScoresBuffer, bufKey)) {
                const v = localScoresBuffer[bufKey];
                finalScores[i] = (Number.isFinite(v) ? v : null);
              } else if (i < scoresRemote.length && scoresRemote[i] !== undefined && scoresRemote[i] !== null) {
                const rn = Number(scoresRemote[i]);
                finalScores[i] = Number.isFinite(rn) ? rn : null;
              } else if (i < scoresLocal.length && scoresLocal[i] !== undefined && scoresLocal[i] !== null) {
                const ln = Number(scoresLocal[i]);
                finalScores[i] = Number.isFinite(ln) ? ln : null;
              } else {
                finalScores[i] = null;
              }
            }
            const total = finalScores.reduce((a,b)=> a + (Number.isFinite(b) ? b : 0), 0);
            const winsVal = (rp && rp.wins) ? (Number.isFinite(Number(rp.wins)) ? Number(rp.wins) : 0) : ((lp && Number.isFinite(Number(lp.wins))) ? Number(lp.wins) : 0);
            mergedPlayers[idx] = { name, scores: finalScores, total, wins: winsVal };
          }

          const winsMap = {};
          if (Array.isArray(base.playersWins)) {
            base.playersWins.forEach(w => { if (w && w.name) winsMap[w.name] = (winsMap[w.name] || 0) + (Number(w.wins) || 0); });
          }
          (playersWins || []).forEach(w => { winsMap[w.name] = (winsMap[w.name] || 0) + (Number(w.wins) || 0); });
          mergedPlayers.forEach(p => { winsMap[p.name] = (winsMap[p.name] || 0) + (Number(p.wins) || 0); });
          const playersWinsArr = Object.keys(winsMap).map(n => ({ name: n, wins: winsMap[n] }));

          base.fixedPlayers = Array.isArray(fixedPlayers) ? fixedPlayers.slice() : base.fixedPlayers;
          base.roundCount = Number.isFinite(Number(payloadMeta.roundCount)) ? payloadMeta.roundCount : (Array.isArray(mergedPlayers) ? Math.max(0, ...mergedPlayers.map(p=>p.scores.length)) : 0);
          base.gameEnded = !!payloadMeta.gameEnded;
          base.editableRound = payloadMeta.editableRound === null ? null : (Number.isInteger(payloadMeta.editableRound) ? payloadMeta.editableRound : base.editableRound);
          base.gameName = payloadMeta.gameName || base.gameName || lastGameName || "";
          base.lastUpdate = payloadMeta.lastUpdate || Date.now();
          base.lastModifiedBy = payloadMeta.lastModifiedBy || CLIENT_ID;
          base.saveId = payloadMeta.saveId || saveId;
          base.players = mergedPlayers;
          base.playersWins = playersWinsArr;
          base.status = (base.gameEnded || base.status === 'finished') ? 'finished' : 'active';

          return base;
        });

        lastLocalSaveMeta = { saveId, timestamp: payloadMeta.lastUpdate };
        localScoresBuffer = {};
        refreshWinsAndTotals();
      } catch (e) {
        console.error("Transaction save failed:", e);
      }
    }

    function saveToDBDebounced(delay = 300) {
      if (applyingRemote) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveToDB(); }, delay);
    }

    function updateScoreInputsListeners() {
      document.querySelectorAll(".score-input").forEach(input => {
        if (input._boundChange) input.removeEventListener("change", input._boundChange);
        if (input._boundFocus) input.removeEventListener("focus", input._boundFocus);
        if (input._boundBlur) input.removeEventListener("blur", input._boundBlur);
        if (input._boundKeydown) input.removeEventListener("keydown", input._boundKeydown);

        const boundChange = function(e){ onScoreInputChange(e.target); };
        const boundFocus = function(e){
          const pi = Number(e.target.dataset.playerIndex);
          const ri = Number(e.target.dataset.roundIndex);
          const key = `${pi}_${ri}`;
          isUserEditing = true;
          editLock[key] = true;
        };
        const boundBlur = function(e){
          const pi = Number(e.target.dataset.playerIndex);
          const ri = Number(e.target.dataset.roundIndex);
          const key = `${pi}_${ri}`;
          setTimeout(()=>{
            isUserEditing = false;
            delete editLock[key];
            saveToDB();
            if (window._pendingRemoteSnapshot && Object.keys(editLock).length === 0) {
              if (window._pendingSnapshotTimer) clearTimeout(window._pendingSnapshotTimer);
              applySnapshotToLocal(window._pendingRemoteSnapshot);
              window._pendingRemoteSnapshot = null;
            }
          }, 120);
        };
        const boundKeydown = function(e){
          if(e.key === 'Enter'){ e.target.blur(); }
        };

        input._boundChange = boundChange;
        input._boundFocus = boundFocus;
        input._boundBlur = boundBlur;
        input._boundKeydown = boundKeydown;

        input.addEventListener("change", boundChange);
        input.addEventListener("focus", boundFocus);
        input.addEventListener("blur", boundBlur);
        input.addEventListener("keydown", boundKeydown);
      });
    }

    function renderRounds() {
      const head = document.getElementById("roundsHead");
      const body = document.getElementById("roundsBody");
      let headHTML = "<tr><th>الجولة</th>";
      players.forEach(p => { headHTML += `<th>${p.name}</th>`; });
      headHTML += "<th>تعديل</th></tr>";
      head.innerHTML = headHTML;

      let totalRow = "<tr style='background:#eee; font-weight:bold;'><td>المجموع</td>";
      players.forEach(p => { totalRow += `<td>${p.total || 0}</td>`; });
      totalRow += "<td>-</td></tr>";
      body.innerHTML = totalRow;

      for (let r = roundCount - 1; r >= 0; r--) {
        let row = `<tr><td>جولة ${r+1}</td>`;
        players.forEach((p, i) => {
          if (!Array.isArray(p.scores)) p.scores = [];
          const bufKey = `${i}_${r}`;
          const hasBuf = Object.prototype.hasOwnProperty.call(localScoresBuffer, bufKey);
          const val = hasBuf ? (localScoresBuffer[bufKey] === null ? "" : localScoresBuffer[bufKey]) : (p.scores[r] !== undefined && p.scores[r] !== null ? p.scores[r] : "");
          const disabled = (editableRound === r && !gameEnded) ? "" : "disabled";
          row += `<td><input class="score-input" data-player-index="${i}" data-round-index="${r}" type="number" value="${val}" ${disabled}></td>`;
        });
        row += `<td><button class="edit-small" onclick="editRound(${r})" ${gameEnded ? "disabled" : ""}>✏️</button></td>`;
        row += "</tr>";
        body.innerHTML += row;
      }

      updateScoreInputsListeners();
    }

    function showToast(message, type = "success", duration = 2000) {
      try {
        const container = document.getElementById("toastContainer");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => { el.style.animation = 'toast-out 300ms forwards'; }, duration);
        setTimeout(() => { try { container.removeChild(el); } catch(e){} }, duration + 320);
      } catch (e) { console.error("toast error", e); }
    }

    window.onScoreInputChange = function(input){
      const pi = Number(input.dataset.playerIndex);
      const ri = Number(input.dataset.roundIndex);
      const raw = input.value;
      if(!players[pi]) return;
      let valueToStore = null;
      if(raw === null || raw === undefined || String(raw).trim() === "") valueToStore = null;
      else { const parsed = Number(raw); valueToStore = Number.isFinite(parsed) ? parsed : null; }
      const key = `${pi}_${ri}`;
      localScoresBuffer[key] = valueToStore;
      if(!Array.isArray(players[pi].scores)) players[pi].scores = [];
      players[pi].scores[ri] = valueToStore;
      recalcTotalsLocal();
      renderPlayersTable(); renderTopPlayers();
      saveToDBDebounced();
    };

    window.editRound = function(r){
      editableRound = r;
      renderRounds();
    };

    const gameSelect = document.getElementById("gameSelect");
    const newGameInput = document.getElementById("newGameInput");
    const addGameBtn = document.getElementById("addGameBtn");
    const playerChoicesDiv = document.getElementById("playerChoices");
    const newPlayerInput = document.getElementById("newPlayerInput");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const addRoundBtn = document.getElementById("addRoundBtn");
    const endGameBtn = document.getElementById("endGameBtn");
    const backBtn = document.getElementById("backBtn");
    const clearWinsBtn = document.getElementById("clearWinsBtn");
    const showActiveBtn = document.getElementById("showActiveBtn");
    const showFinishedBtn = document.getElementById("showFinishedBtn");
    const roomsModal = document.getElementById("roomsModal");
    const closeRoomsBtn = document.getElementById("closeRoomsBtn");
    const roomsList = document.getElementById("roomsList");
    const roomsModalTitle = document.getElementById("roomsModalTitle");

    addGameBtn.onclick = ()=>{ const val = newGameInput.value.trim(); if(!val) return; const opt = document.createElement("option"); opt.value=val; opt.textContent=val; gameSelect.appendChild(opt); gameSelect.value=val; newGameInput.value=""; };

    addPlayerBtn.onclick = async ()=>{ 
      const val = newPlayerInput.value.trim(); if(!val) return;
      if(!fixedPlayers.includes(val)) fixedPlayers.push(val);
      renderPlayerChoices();
      newPlayerInput.value="";
      try { await update(ref(db, 'meta'), { fixedPlayers }); } catch(e){}
      if (currentGameId) await saveToDB();
    };

    startGameBtn.onclick = async ()=>{
      const selected = [...playerChoicesDiv.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value.trim()).filter(isText);
      if(selected.length<2){ alert("اختر لاعبين على الأقل"); return; }
      const dateStr = todayDateStr();
      let nameBase = `${gameSelect.value}_${selected.join("_")}_${dateStr}`;
      const id = sanitizeForKey(nameBase + "_" + Date.now());
      currentGameId = id;
      lastGameName = nameBase;
      players = selected.map(n=>({name:n,scores:[],total:0,wins:0}));
      roundCount=0; editableRound=null; gameEnded=false;
      currentGameRef=gameRefById(currentGameId);
      resetLocalEditingState();
      attachListenerToGame(currentGameId);
      renderPlayerChoices();
      document.getElementById("setup").style.display="none";
      document.getElementById("game").style.display="block";
      document.getElementById("gameName").textContent="🎲 اللعبة: "+lastGameName;
      renderTopPlayers(); renderPlayersTable(); renderRounds();
      showToast("✅ تم بدء الجيم بنجاح", "success", 2000);
      await saveToDB();
    };

    addRoundBtn.onclick = ()=>{
      players.forEach(p=>{ if(!Array.isArray(p.scores)) p.scores=[]; p.scores.push(null); });
      roundCount++;
      editableRound = roundCount - 1;
      renderRounds();
      saveToDBDebounced();
    };

    async function incrementWinsForWinners(winnerNames){
      if(!Array.isArray(winnerNames) || winnerNames.length===0) return;
      const promises = winnerNames.map(name=>{
        const key = sanitizeForKey(name);
        const r = ref(db, `playersWins/${key}`);
        return runTransaction(r, (current)=>{
          if(current === null || current === undefined) return { name: name, wins: 1 };
          if(typeof current === 'number') return { name: name, wins: Number(current) + 1 };
          if(typeof current === 'object'){ const currentWins = Number(current.wins) || 0; return { name: (current.name || name), wins: currentWins + 1 }; }
          return { name: name, wins: 1 };
        }).catch(e=>{ console.error("increment win error for", name, e); });
      });
      await Promise.all(promises);
    }

    endGameBtn.onclick = async ()=>{
      if(!currentGameRef){
        showToast("لا يوجد جيم مفتوح حالياً", "warn", 1800);
        return;
      }
      try {
        const snap = await get(currentGameRef);
        const currentVal = snap.val() || {};
        if (currentVal.gameEnded || currentVal.status === 'finished') {
          showToast("هذا الجيم مُنتهي بالفعل", "info", 1800);
          players = [];
          resetLocalEditingState();
          document.getElementById("setup").style.display="block";
          document.getElementById("game").style.display="none";
          currentGameId = null;
          currentGameRef = null;
          try{ localStorage.removeItem('currentGameId'); }catch(e){}
          renderPlayerChoices();
          renderPlayersTable();
          renderRounds();
          return;
        }
      } catch(err){
        console.error("Error fetching game before ending:", err);
        showToast("خطأ أثناء تحقق الحالة", "warn", 1600);
        return;
      }

      if(!confirm("هل أنت متأكد من إنهاء الجيم؟")) return;

      gameEnded=true;
      editableRound=null;
      players.forEach(p=>{ if(!p.wins) p.wins=0; });
      recalcTotalsLocal();

      const totals = players.map(p => Number(p.total) || 0);
      const maxTotal = totals.length ? Math.max(...totals) : 0;

      const winners = players.filter(p=>p.total===maxTotal).map(p=>p.name);
      players.filter(p=>winners.includes(p.name)).forEach(p=>p.wins = (Number(p.wins)||0) + 1);

      await incrementWinsForWinners(winners);
      renderPlayersTable(); renderTopPlayers(); refreshWinsAndTotals();
      showToast(`🎉 الفائز${winners.length>1?'ون':''}: ${winners.join(", ")}`, "info", 3500);

      await saveToDB();

      players = [];
      resetLocalEditingState();
      document.getElementById("setup").style.display="block";
      document.getElementById("game").style.display="none";
      currentGameId = null;
      currentGameRef = null;
      try{ localStorage.removeItem('currentGameId'); }catch(e){}
      document.getElementById("addRoundBtn").disabled = false;
      document.getElementById("endGameBtn").disabled = false;
      renderPlayerChoices();
      renderPlayersTable();
      renderRounds();
    };

    backBtn.onclick = ()=>{
      players = [];
      resetLocalEditingState();
      document.getElementById("setup").style.display="block";
      document.getElementById("game").style.display="none";
      currentGameId = null;
      currentGameRef = null;
      try{ localStorage.removeItem('currentGameId'); }catch(e){}
      document.getElementById("addRoundBtn").disabled = false;
      document.getElementById("endGameBtn").disabled = false;
      renderPlayerChoices();
      renderPlayersTable();
      renderRounds();
    };

    clearWinsBtn.onclick = async ()=>{
      const pwd = prompt("ادخل الرقم السري لمسح بيانات الفوز:");
      if (pwd === null) return;
      if (pwd !== ADMIN_PASSWORD) { alert("رقم سري خاطئ!"); return; }
      if(!confirm("هل أنت متأكد من مسح جميع بيانات الفوز؟")) return;
      try {
        await remove(winsRef());
        playersWins = [];
        playersWinsWithPoints = [];
        renderWinsTable();
        showToast("✅ تم مسح بيانات الفوز بنجاح!", "warn", 2200);
      } catch (e) {
        console.error("Firebase error:", e);
        alert("❌ فشل في مسح بيانات الفوز!");
      }
    };

    function deleteGamePrompt(gameId){
      const pwd = prompt("ادخل الرقم السري لحذف الجيم:");
      if(pwd === null) return;
      if(pwd!==ADMIN_PASSWORD){ alert("رقم سري خاطئ!"); return; }
      if(!confirm("هل أنت متأكد من حذف هذا الجيم؟")) return;
      remove(gameRefById(gameId)).then(()=>{
        resetLocalEditingState();
        if (currentGameId === gameId) {
          currentGameId = null; currentGameRef = null;
          try{ localStorage.removeItem('currentGameId'); }catch(e){}
          document.getElementById("setup").style.display="block";
          document.getElementById("game").style.display="none";
        }
        showToast("تم حذف الجيم", "warn", 1600);
      }).catch(e=>{
        console.error("Delete game error:", e);
        alert("فشل حذف الجيم!");
      });
    }

    async function showGamesModal(filterStatus) {
      roomsModal.style.display="flex";
      roomsList.innerHTML = "<div class='muted'>جارٍ التحميل...</div>";
      roomsModalTitle.textContent = filterStatus === 'finished' ? "🏁 الجيمات المنتهية" : "🎯 الجيمات الشغالة";
      try {
        const snap = await get(ref(db,'games'));
        const val = snap.val() || {};
        roomsList.innerHTML="";
        const keys = Object.keys(val).sort((a,b)=>b.localeCompare(a));
        let found=false;
        keys.forEach(k=>{
          const g = val[k] || {};
          const status = g.status || (g.gameEnded ? 'finished' : 'active');
          if ((filterStatus === 'finished' && status==='finished') || (filterStatus !== 'finished' && status!=='finished')) {
            found=true;
            const div = document.createElement("div");
            const playersNames = (Array.isArray(g.players)? g.players.map(p=>p && p.name).filter(Boolean) : []);
            div.innerHTML = `<div style="flex:1"><span class="game-title">${g.gameName||k}</span> <span class="muted">(${playersNames.join(", ")})</span></div>`;
            const controls = document.createElement("div");
            controls.style.display = "flex";
            controls.style.gap = "6px";
            const openBtn = document.createElement("button");
            openBtn.className="small"; openBtn.textContent = "فتح";
            openBtn.onclick = ()=>{
              attachListenerToGame(k);
              roomsModal.style.display="none";
            };
            controls.appendChild(openBtn);
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-small"; deleteBtn.textContent = "🗑️";
            deleteBtn.onclick = ()=>{ deleteGamePrompt(k); };
            controls.appendChild(deleteBtn);
            div.appendChild(controls);
            roomsList.appendChild(div);
          }
        });
        if(!found) roomsList.innerHTML = "<div class='muted'>لا توجد جيمات مطابقة</div>";
      } catch(e){
        console.error("Error fetching games list:", e);
        roomsList.innerHTML = "<div class='muted'>حدث خطأ أثناء جلب الجيمات</div>";
      }
    }

    showActiveBtn.onclick = ()=> showGamesModal('active');
    showFinishedBtn.onclick = ()=> showGamesModal('finished');
    closeRoomsBtn.onclick = ()=>{ roomsModal.style.display="none"; };

    renderPlayerChoices();
    renderWinsTable();
    attachWinsListener();
    const savedId = localStorage.getItem('currentGameId');
    if(savedId) attachListenerToGame(savedId);
    refreshWinsAndTotals();
  </script>
</body>
</html>
