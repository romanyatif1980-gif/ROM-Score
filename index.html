<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <title>Scores Live - Debug</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body{font-family:Arial, sans-serif;direction:rtl;padding:18px;background:#f4f6f8}
    .box{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);max-width:900px;margin:12px auto}
    button{padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
    .status{padding:8px;margin-bottom:10px;border-radius:6px}
    .ok{background:#e6ffea;color:#0b6b2f}
    .err{background:#ffe6e6;color:#8b1313}
    pre{background:#111;color:#eee;padding:10px;border-radius:8px;overflow:auto}
  </style>

  <!-- Use compat build for simple HTML pages -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="box">
    <h2>تشغيل ومراجعة - Live Scores</h2>
    <div id="status" class="status">جاري التهيئة...</div>

    <div>
      <button onclick="openConsole()">افتح Console (F12)</button>
      <button onclick="testConnection()">اختبار الاتصال بـ Firebase</button>
    </div>

    <h3>سجلات التنفيذ (Console)</h3>
    <pre id="log" style="height:200px"></pre>
  </div>

<script>
  // ---------- Logging utilities ----------
  function log(...args){ 
    console.log(...args);
    const el = document.getElementById('log');
    el.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a))).join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(text, ok=true){
    const s = document.getElementById('status');
    s.textContent = text;
    s.className = 'status ' + (ok ? 'ok' : 'err');
    log('[STATUS] ' + text);
  }
  function openConsole(){ alert('افتح DevTools (F12) وابص على Console & Network'); }

  // ---------- Basic checks ----------
  if (typeof firebase === 'undefined') {
    setStatus('خطأ: Firebase SDK لم يُحمّل. تأكد من اتصال الانترنت أو نسخة SDK.', false);
    throw new Error('firebase is undefined');
  } else {
    log('Firebase SDK موجود:', firebase && firebase.SDK_VERSION ? ('SDK ' + firebase.SDK_VERSION) : 'compat build');
  }

  // ---------- Firebase config (تأكد من مطابقة databaseURL لديك) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
    authDomain: "rom-score.firebaseapp.com",
    databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
    projectId: "rom-score",
    storageBucket: "rom-score.firebasestorage.app",
    messagingSenderId: "1009545441375",
    appId: "1:1009545441375:web:460f2db0c984d24936abea",
    measurementId: "G-BKNE7YZ7FM"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    log('firebase.initializeApp() succeeded');
  } catch (e) {
    log('Error initializing Firebase:', e);
    setStatus('خطأ أثناء تهيئة Firebase: ' + e.message, false);
    throw e;
  }

  let db;
  try {
    db = firebase.database();
    log('firebase.database() ready, URL:', db?.app?.options?.databaseURL || '—');
    setStatus('Firebase مُهيأ. جاهز للاتصال.', true);
  } catch (e) {
    log('Error creating database instance:', e);
    setStatus('خطأ عند إنشاء db instance: ' + e.message, false);
    throw e;
  }

  // ---------- اختبار قراءة/كتابة بسيطة ----------
  const ref = db.ref('debug/testConnection');

  function testConnection(){
    setStatus('جارٍ اختبار الكتابة والقراءة...', true);
    const payload = { ts: Date.now(), from: location.hostname || 'local' };
    ref.set(payload)
      .then(() => {
        log('✓ كتابة ناجحة:', payload);
        return ref.once('value');
      })
      .then(snapshot => {
        const val = snapshot.val();
        log('✓ قراءة ناجحة:', val);
        setStatus('اختبار الاتصال ناجح — Firebase يعمل.', true);
      })
      .catch(err => {
        log('✗ خطأ في read/write:', err);
        setStatus('فشل اختبار الاتصال: ' + (err && err.message ? err.message : String(err)), false);
      });
  }

  // ---------- استماع عام على data (خفيف للتجربة) ----------
  const generalRef = db.ref('gameData');
  generalRef.on('value', snap => {
    log('[on value] gameData changed:', snap.val());
  }, err => {
    log('[on value] error listening:', err);
    setStatus('خطأ في الـ listener: ' + (err && err.message ? err.message : String(err)), false);
  });

  // ---------- معلومات إضافية للمستخدم ----------
  log('توجيهات سريعة:');
  log('- شغّل هذا الملف عبر سيرفر محلي (python -m http.server أو Live Server في VSCode).');
  log('- اذهب إلى Firebase Console → Realtime Database → Rules وجرب: { ".read": true, ".write": true } أثناء الاختبار.');
  log('- افتح DevTools (F12) وانسخ أى أخطاء هنا لو احتجت مساعدة إضافية.');

  setStatus('جاهز. اضغط "اختبار الاتصال" لإجراء فحص.', true);
</script>
</body>
</html>
