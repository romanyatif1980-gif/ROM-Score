<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tana & Rona - إدارة الجيمات</title>
<style>
  body { font-family: Arial, sans-serif; background:#fff; color:#333; margin:0; padding:0; }
  #setup, #game { padding:20px; }
  button { cursor:pointer; padding:5px 10px; margin:2px; border-radius:5px; border:none; background:#e0c97f; color:#000; }
  button.delete-small { background:#ff6666; color:#fff; }
  button.small { background:#ccc; }
  input[type=text], input[type=number] { padding:4px; border-radius:3px; border:1px solid #ccc; width:100px; }
  table { border-collapse: collapse; margin-top:10px; }
  th, td { border:1px solid #ccc; padding:5px; text-align:center; }
  #toastContainer { position:fixed; top:20px; right:20px; z-index:9999; }
  .toast { padding:10px 15px; margin-bottom:5px; border-radius:5px; color:#fff; animation:toast-in 300ms; }
  .toast.success { background:green; }
  .toast.warn { background:orange; }
  .toast.info { background:blue; }
  @keyframes toast-in { from {opacity:0; transform:translateY(-10px);} to {opacity:1; transform:translateY(0);} }
  @keyframes toast-out { from {opacity:1;} to {opacity:0;} }
  #loadingOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:#fff; font-size:20px; justify-content:center; align-items:center; }
</style>
</head>
<body>

<div id="toastContainer"></div>
<div id="loadingOverlay">جارٍ التحميل...</div>

<div id="setup">
  <h2>🎲 إعداد الجيم</h2>
  <div>
    <label>أسماء الجيمات:</label>
    <select id="gameSelect"></select>
    <input type="text" id="newGameInput" placeholder="جيم جديد">
    <button id="addGameBtn">إضافة جيم</button>
  </div>
  <div>
    <h3>اختيار اللاعبين</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn">إضافة لاعب</button>
  </div>
  <div>
    <button id="startGameBtn">بدء الجيم</button>
  </div>
  <div>
    <button id="showActiveBtn">عرض الجيمات الشغالة</button>
    <button id="showFinishedBtn">عرض الجيمات المنتهية</button>
  </div>
</div>

<div id="game" style="display:none;">
  <h2 id="gameName"></h2>
  <div>
    <button id="addRoundBtn">إضافة جولة</button>
    <button id="endGameBtn">إنهاء الجيم</button>
    <button id="backBtn">العودة</button>
    <button id="clearWinsBtn">مسح بيانات الفوز</button>
  </div>
  <table id="roundsHead"></table>
  <table id="roundsBody"></table>
</div>

<div id="roomsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:#000; overflow:auto; padding:20px;">
  <h3 id="roomsModalTitle"></h3>
  <div id="roomsList"></div>
  <button id="closeRoomsBtn">إغلاق</button>
</div>

<script type="module">
// ---------- الجزء الثاني: كود JS + Firebase سيأتي في الجزء 2 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, runTransaction, onValue, update } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

// ----------- إعداد Firebase -----------
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ----------- متغيرات عالمية -----------
let players = [];
let roundCount = 0;
let editableRound = null;
let gameEnded = false;
let readOnlyView = false;
let currentGameId = null;
let currentGameRef = null;
let localScoresBuffer = {};
let fixedPlayers = ["أحمد","محمود","منى","سارة","خالد","ليلى"];
let playersWins = [];
const CLIENT_ID = "client_" + Math.floor(Math.random()*1000);
const ADMIN_PASSWORD = "1234";

// ---------- Helpers ----------
function isText(s){ return typeof s==="string" && s.trim().length>0; }
function sanitizeForKey(str){ return str.replace(/[^a-zA-Z0-9_-]/g,"_"); }
function todayDateStr(){ const d=new Date(); return `${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`; }
function recalcTotalsLocal(){ players.forEach(p=>{p.total=(Array.isArray(p.scores)?p.scores.reduce((a,b)=>a+(Number(b)||0),0):0); }); }
function refreshWinsAndTotals(){ recalcTotalsLocal(); renderPlayersTable(); renderTopPlayers(); }

// ---------- Firebase Refs ----------
function gameRefById(id){ return ref(db,"games/"+id); }
function winsRef(){ return ref(db,"playersWins"); }

// ---------- Toast ----------
function showToast(message,type="success",duration=2000){
  try{
    const container = document.getElementById("toastContainer");
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(()=>{ el.style.animation = 'toast-out 300ms forwards'; },duration);
    setTimeout(()=>{ try{ container.removeChild(el);}catch(e){} },duration+320);
  }catch(e){ console.error("toast error",e); }
}

// ---------- Render ----------
function renderPlayerChoices(){
  const div = document.getElementById("playerChoices");
  div.innerHTML="";
  fixedPlayers.forEach(p=>{
    const label = document.createElement("label");
    label.style.marginRight="10px";
    const chk = document.createElement("input");
    chk.type="checkbox"; chk.value=p;
    label.appendChild(chk);
    label.appendChild(document.createTextNode(" "+p));
    div.appendChild(label);
  });
}

function renderTopPlayers(){
  // simple: reorder players by total
  players.sort((a,b)=> (b.total||0)-(a.total||0));
}

function renderPlayersTable(){
  // for now, we just refresh totals
  recalcTotalsLocal();
}

// ---------- Rounds Table ----------
function updateScoreInputsListeners(){
  document.querySelectorAll(".score-input").forEach(input=>{
    if(input._boundChange) input.removeEventListener("change", input._boundChange);
    if(input._boundFocus) input.removeEventListener("focus", input._boundFocus);
    if(input._boundBlur) input.removeEventListener("blur", input._boundBlur);
    if(input._boundKeydown) input.removeEventListener("keydown", input._boundKeydown);

    const boundChange=function(e){ onScoreInputChange(e.target); };
    const boundFocus=function(e){
      const key=`${e.target.dataset.playerIndex}_${e.target.dataset.roundIndex}`;
      input.dataset.editing="1";
      localScoresBuffer[key]=localScoresBuffer[key]??null;
    };
    const boundBlur=function(e){
      const key=`${e.target.dataset.playerIndex}_${e.target.dataset.roundIndex}`;
      delete input.dataset.editing;
      saveToDBDebounced();
    };
    const boundKeydown=function(e){ if(e.key==="Enter") e.target.blur(); };

    input._boundChange=boundChange;
    input._boundFocus=boundFocus;
    input._boundBlur=boundBlur;
    input._boundKeydown=boundKeydown;

    input.addEventListener("change",boundChange);
    input.addEventListener("focus",boundFocus);
    input.addEventListener("blur",boundBlur);
    input.addEventListener("keydown",boundKeydown);
  });
}

function renderRounds(){
  const head=document.getElementById("roundsHead");
  const body=document.getElementById("roundsBody");
  let headHTML="<tr><th>الجولة</th>";
  players.forEach(p=>{ headHTML+=`<th>${p.name}</th>`; });
  headHTML+="<th>تعديل</th></tr>";
  head.innerHTML=headHTML;

  let totalRow="<tr style='background:#eee; font-weight:bold;'><td>المجموع</td>";
  players.forEach(p=>{ totalRow+=`<td>${p.total||0}</td>`; });
  totalRow+="<td>-</td></tr>";
  body.innerHTML=totalRow;

  for(let r=0;r<roundCount;r++){
    let row=`<tr><td>جولة ${r+1}</td>`;
    players.forEach((p,i)=>{
      const bufKey=`${i}_${r}`;
      const val=Object.prototype.hasOwnProperty.call(localScoresBuffer,bufKey)? localScoresBuffer[bufKey]: (Array.isArray(p.scores)? p.scores[r]??"": ""); 
      const disabled=(editableRound===r && !gameEnded && !readOnlyView)? "":"disabled";
      row+=`<td><input class="score-input" data-player-index="${i}" data-round-index="${r}" type="number" value="${val}" ${disabled}></td>`;
    });
    row+=`<td><button onclick="editRound(${r})" ${gameEnded||readOnlyView?"disabled":""}>✏️</button></td>`;
    row+="</tr>";
    body.innerHTML+=row;
  }
  updateScoreInputsListeners();
}

// ---------- Score Input ----------
window.onScoreInputChange=function(input){
  const pi=Number(input.dataset.playerIndex);
  const ri=Number(input.dataset.roundIndex);
  let val=input.value.trim();
  const key=`${pi}_${ri}`;
  localScoresBuffer[key]=val===""?null:Number(val);
  if(!Array.isArray(players[pi].scores)) players[pi].scores=[];
  players[pi].scores[ri]=localScoresBuffer[key];
  recalcTotalsLocal();
  renderPlayersTable(); renderTopPlayers();
  saveToDBDebounced();
};

window.editRound=function(r){ if(readOnlyView) return; editableRound=r; renderRounds(); };

// ---------- Save & DB ----------
let saveTimer=null;
let applyingRemote=false;

async function saveToDB(){
  if(!currentGameRef) return;
  try{
    await runTransaction(currentGameRef,current=>{
      const base=current||{};
      base.players=players.map(p=>({ name:p.name, scores:p.scores, total:p.total, wins:p.wins||0 }));
      base.roundCount=roundCount;
      base.gameEnded=gameEnded;
      base.status=gameEnded?'finished':'active';
      base.lastUpdate=Date.now();
      return base;
    });
    localScoresBuffer={};
  }catch(e){ console.error("Transaction save failed:",e); }
}

function saveToDBDebounced(delay=300){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ saveToDB(); },delay);
}

// ---------- Button Actions ----------
document.getElementById("addGameBtn").onclick=()=>{
  const val=document.getElementById("newGameInput").value.trim();
  if(!val) return;
  const sel=document.getElementById("gameSelect");
  const opt=document.createElement("option"); opt.value=val; opt.textContent=val; sel.appendChild(opt); sel.value=val;
  document.getElementById("newGameInput").value="";
};

document.getElementById("addPlayerBtn").onclick=()=>{
  const val=document.getElementById("newPlayerInput").value.trim();
  if(!val) return;
  if(!fixedPlayers.includes(val)) fixedPlayers.push(val);
  renderPlayerChoices();
  document.getElementById("newPlayerInput").value="";
};

document.getElementById("startGameBtn").onclick=async()=>{
  const selected=[...document.querySelectorAll("#playerChoices input:checked")].map(x=>x.value);
  if(selected.length<2){ alert("اختر لاعبين على الأقل"); return; }
  currentGameId=sanitizeForKey(document.getElementById("gameSelect").value+"_"+Date.now());
  currentGameRef=gameRefById(currentGameId);
  players=selected.map(n=>({name:n,scores:[],total:0,wins:0}));
  roundCount=0; editableRound=null; gameEnded=false; readOnlyView=false;
  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("gameName").textContent="🎲 اللعبة: "+document.getElementById("gameSelect").value;
  renderRounds();
  await saveToDB();
};

document.getElementById("addRoundBtn").onclick=()=>{
  if(readOnlyView) return;
  players.forEach(p=>{ if(!Array.isArray(p.scores)) p.scores=[]; p.scores.push(null); });
  roundCount++; editableRound=roundCount-1;
  renderRounds(); saveToDBDebounced();
};

document.getElementById("endGameBtn").onclick=async()=>{
  if(!confirm("هل أنت متأكد من إنهاء الجيم؟")) return;
  gameEnded=true; editableRound=null;
  const totals=players.map(p=>p.total); const maxTotal=Math.max(...totals);
  const winners=players.filter(p=>p.total===maxTotal).map(p=>p.name);
  winners.forEach(w=>{
    const p=players.find(pl=>pl.name===w);
    if(p) p.wins=(p.wins||0)+1;
  });
  renderRounds(); renderPlayersTable(); renderTopPlayers();
  showToast("تم إنهاء الجيم", "info");
  await saveToDB();
};

document.getElementById("backBtn").onclick=()=>{
  players=[]; currentGameId=null; currentGameRef=null; gameEnded=false;
  document.getElementById("setup").style.display="block"; document.getElementById("game").style.display="none";
};

document.getElementById("clearWinsBtn").onclick=async()=>{
  const pwd=prompt("ادخل الرقم السري لمسح بيانات الفوز:");
  if(pwd!==ADMIN_PASSWORD) return alert("رقم سري خاطئ!");
  if(!confirm("هل أنت متأكد؟")) return;
  await remove(winsRef()); playersWins=[]; showToast("تم مسح بيانات الفوز","warn");
};

document.getElementById("showActiveBtn").onclick=()=>showGamesModal("active");
document.getElementById("showFinishedBtn").onclick=()=>showGamesModal("finished");
document.getElementById("closeRoomsBtn").onclick=()=>{ document.getElementById("roomsModal").style.display="none"; };

// ---------- Show Games ----------
async function showGamesModal(filter){
  const modal=document.getElementById("roomsModal");
  const list=document.getElementById("roomsList");
  list.innerHTML="جارٍ التحميل...";
  modal.style.display="flex";
  try{
    const snap=await get(ref(db,"games"));
    const val=snap.val()||{};
    list.innerHTML="";
    Object.keys(val).sort((a,b)=>b.localeCompare(a)).forEach(k=>{
      const g=val[k]; const status=g.status||'active';
      if((filter==="finished" && status==="finished")||(filter!=="finished" && status!=="finished")){
        const div=document.createElement("div");
        div.innerHTML=`<strong>${g.gameName||k}</strong> (${(g.players||[]).map(p=>p.name).join(",")})`;
        const openBtn=document.createElement("button"); openBtn.textContent="فتح";
        openBtn.onclick=()=>openGameFromList(k,status==="finished");
        const delBtn=document.createElement("button"); delBtn.textContent="🗑️";
        delBtn.onclick=()=>deleteGamePrompt(k);
        div.appendChild(openBtn); div.appendChild(delBtn);
        list.appendChild(div);
      }
    });
  }catch(e){ list.innerHTML="حدث خطأ أثناء جلب الجيمات"; console.error(e); }
}

async function openGameFromList(id,readOnly=false){
  try{
    const snap=await get(gameRefById(id)); const val=snap.val();
    if(!val) return alert("الجيم غير موجود");
    readOnlyView=readOnly||val.status==="finished";
    players=(val.players||[]).map(p=>({...p}));
    roundCount=val.roundCount||0;
    editableRound=null; currentGameId=id; currentGameRef=gameRefById(id);
    document.getElementById("setup").style.display="none"; document.getElementById("game").style.display="block";
    renderRounds();
  }catch(e){ console.error(e); alert("فشل فتح الجيم"); }
}

function deleteGamePrompt(id){
  const pwd=prompt("ادخل الرقم السري لحذف الجيم:");
  if(pwd!==ADMIN_PASSWORD) return alert("رقم سري خاطئ!");
  if(!confirm("هل أنت متأكد؟")) return;
  remove(gameRefById(id)).then(()=>{
    if(currentGameId===id){ currentGameId=null; currentGameRef=null; document.getElementById("setup").style.display="block"; document.getElementById("game").style.display="none"; }
    showToast("تم حذف الجيم","warn");
  }).catch(e=>{ console.error(e); alert("فشل حذف الجيم"); });
}

// ---------- Init ----------
renderPlayerChoices();
