<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>🎮 تسجيل السكورات Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f8f8f8; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .section { background: #fff; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 900px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { border: none; border-radius: 8px; padding: 8px 14px; font-weight: bold; cursor: pointer; margin: 4px; }
    .add { background: #2196f3; color: #fff; }
    .start { background: #4caf50; color: #fff; }
    .end { background: #f44336; color: #fff; }
    .edit { background: #ff9800; color: #fff; }
    input, select { padding: 7px; border: 1px solid #ccc; border-radius: 6px; margin: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    .top { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px; }
    .card { background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 130px; text-align: center; font-weight: bold; }
  </style>

  <!-- ✅ Firebase CDN (نسخة رسمية محدثة) -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database-compat.js"></script>
</head>

<body>
  <h1>🎯 تسجيل السكورات (متزامن أونلاين)</h1>

  <div id="setup" class="section">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎮 اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>كوتشينة</option>
    </select>
    <input type="text" id="newGame" placeholder="إضافة لعبة جديدة">
    <button class="add" onclick="addGame()">إضافة</button>

    <h3>👥 اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayer" placeholder="إضافة لاعب جديد">
    <button class="add" onclick="addPlayer()">إضافة</button>
    <br><br>
    <button class="start" onclick="startGame()">ابدأ الجيم 🚀</button>
  </div>

  <div id="game" class="section" style="display:none;">
    <h2 id="gameName"></h2>
    <div id="topPlayers" class="top"></div>

    <table id="playersTable">
      <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>

    <br>
    <button class="add" onclick="addRound()">إضافة جولة جديدة ➕</button>
    <button class="end" onclick="endGame()">إنهاء الجيم ✅</button>

    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div id="wins" class="section">
    <h2>🏆 عدد مرات الفوز</h2>
    <table>
      <thead><tr><th>اللاعب</th><th>الفوز</th></tr></thead>
      <tbody id="winsBody"></tbody>
    </table>
  </div>

  <script>
    // =================== Firebase إعداد ===================
    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.firebasestorage.app",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ref = db.ref("gameData");

    // =================== متغيرات ===================
    const defaultPlayers = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    let fixedPlayers = defaultPlayers.slice();
    let players = [];
    let playersWins = [];
    let roundCount = 0;
    let editableRound = null;
    let gameEnded = false;

    // =================== تحديث Firebase ===================
    function saveData() {
      ref.set({ fixedPlayers, players, playersWins, roundCount, editableRound, gameEnded });
    }

    // =================== استماع للتغييرات Live ===================
    ref.on("value", snap => {
      const d = snap.val();
      if (!d) return;
      fixedPlayers = d.fixedPlayers || fixedPlayers;
      players = d.players || [];
      playersWins = d.playersWins || [];
      roundCount = d.roundCount || 0;
      editableRound = d.editableRound ?? null;
      gameEnded = d.gameEnded || false;

      renderPlayerChoices();
      renderPlayersTable();
      renderTopPlayers();
      renderRounds();
      renderWins();

      if (players.length && !gameEnded) {
        document.getElementById("setup").style.display = "none";
        document.getElementById("game").style.display = "block";
      }
    });

    // =================== دوال ===================
    function renderPlayerChoices() {
      const div = document.getElementById("playerChoices");
      div.innerHTML = "";
      fixedPlayers.forEach(name => {
        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.value = name;
        if (players.some(p => p.name === name)) chk.checked = true;
        const lbl = document.createElement("label");
        lbl.appendChild(chk);
        lbl.append(" " + name + " ");
        div.appendChild(lbl);
      });
    }

    function addPlayer() {
      const name = document.getElementById("newPlayer").value.trim();
      if (!name) return;
      if (!fixedPlayers.includes(name)) fixedPlayers.push(name);
      document.getElementById("newPlayer").value = "";
      saveData();
    }

    function addGame() {
      const name = document.getElementById("newGame").value.trim();
      if (!name) return;
      const select = document.getElementById("gameSelect");
      const opt = document.createElement("option");
      opt.textContent = name;
      opt.value = name;
      select.appendChild(opt);
      select.value = name;
      document.getElementById("newGame").value = "";
    }

    function startGame() {
      const selected = Array.from(document.querySelectorAll("#playerChoices input:checked")).map(c => c.value);
      if (selected.length < 2) return alert("اختر لاعبين على الأقل!");
      players = selected.map(n => ({ name: n, scores: [], total: 0, wins: (playersWins.find(p=>p.name===n)?.wins)||0 }));
      roundCount = 0; gameEnded = false; editableRound = null;
      document.getElementById("gameName").textContent = "🎮 اللعبة: " + document.getElementById("gameSelect").value;
      saveData();
    }

    function renderPlayersTable() {
      const body = document.getElementById("playersBody");
      body.innerHTML = "";
      players.sort((a,b)=>b.total-a.total).forEach(p=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${p.name}</td><td>${p.total||0}</td>`;
        body.appendChild(tr);
      });
    }

    function renderTopPlayers() {
      const div = document.getElementById("topPlayers");
      div.innerHTML = "";
      players.filter(p=>p.total>0).sort((a,b)=>b.total-a.total).forEach(p=>{
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `${p.name}<br>⭐ ${p.total}`;
        div.appendChild(card);
      });
    }

    function addRound() {
      if (gameEnded) return;
      roundCount++;
      players.forEach(p => {
        if (!Array.isArray(p.scores)) p.scores = [];
        p.scores.push(undefined);
      });
      editableRound = roundCount - 1;
      saveData();
    }

    function renderRounds() {
      const head = document.getElementById("roundsHead");
      const body = document.getElementById("roundsBody");
      if (!players.length) { head.innerHTML=""; body.innerHTML=""; return; }

      head.innerHTML = "<tr><th>الجولة</th>" + players.map(p=>`<th>${p.name}</th>`).join('') + "<th>تعديل</th></tr>";
      body.innerHTML = "";

      // صف المجموع
      let totalRow = "<tr style='background:#eee;font-weight:bold'><td>المجموع</td>";
      players.forEach(p => totalRow += `<td>${p.total||0}</td>`);
      totalRow += "<td>-</td></tr>";
      body.innerHTML = totalRow;

      for (let r = roundCount - 1; r >= 0; r--) {
        let row = `<tr><td>جولة ${r+1}</td>`;
        players.forEach((p, i) => {
          const val = p.scores[r] ?? "";
          const dis = (editableRound === r && !gameEnded) ? "" : "disabled";
          row += `<td><input type='number' value='${val}' onchange='updateScore(${i},${r},this.value)' ${dis}></td>`;
        });
        row += `<td><button class='edit' onclick='editRound(${r})'>✏️</button></td></tr>`;
        body.innerHTML += row;
      }
    }

    function editRound(r) {
      if (gameEnded) return;
      editableRound = r;
      saveData();
      alert("يمكنك تعديل الجولة رقم " + (r+1));
    }

    function updateScore(i,r,val) {
      if (!players[i]) return;
      players[i].scores[r] = val === "" ? undefined : Number(val);
      players[i].total = players[i].scores.reduce((a,b)=>a+(b||0),0);
      saveData();
    }

    function endGame() {
      if (players.length === 0) return;
      gameEnded = true;
      editableRound = null;
      const winner = players.reduce((a,b)=>a.total>b.total?a:b);
      winner.wins = (winner.wins||0)+1;
      const f = playersWins.find(p=>p.name===winner.name);
      if (f) f.wins = winner.wins; else playersWins.push({name:winner.name,wins:winner.wins});
      saveData();
      alert("الفائز هو: " + winner.name);
    }

    function renderWins() {
      const body = document.getElementById("winsBody");
      body.innerHTML = "";
      playersWins.sort((a,b)=>b.wins-a.wins).forEach(p=>{
        body.innerHTML += `<tr><td>${p.name}</td><td>${p.wins||0}</td></tr>`;
      });
    }

    // تحميل مبدئي
    window.onload = () => {
      renderPlayerChoices();
      renderWins();
    };
  </script>
</body>
</html>
