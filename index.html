<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>🎮 تسجيل السكورات (Live - Firebase - Rooms)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .setup, .game, .wins { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin: 20px auto; max-width: 900px; }
    input, select, button { padding: 7px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { cursor: pointer; font-weight: bold; }
    .start { background: #4caf50; color: white; }
    .add { background: #2196f3; color: white; }
    .top-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 150px; text-align: center; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; padding: 5px; text-align: center; }
    .buttons { margin: 20px 0; text-align: center; }
    .buttons button { margin: 5px; padding: 10px 15px; border: none; border-radius: 8px; }
    .end { background: #f44336; color: white; }
    .edit-small { background: #ff9800; color: white; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
    .small { font-size: 12px; padding:6px 10px; border-radius:6px; }
    /* modal for games list */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal { background: white; padding: 16px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 70vh; overflow: auto; }
    .game-row { display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee; }
    .game-title { font-weight: bold; }
    .muted { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <h1>🎮 تسجيل السكورات</h1>

  <div style="text-align:center; margin-bottom:10px;">
    <button id="showRoomsBtn" class="small">🎯 عرض الجيمات الشغالة</button>
  </div>

  <div class="setup" id="setup">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎲 اختر اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>لعبة الورق</option>
    </select>
    <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
    <button id="addGameBtn" class="add">➕ إضافة لعبة</button>

    <hr>

    <h3>👥 اختر اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

    <br>
    <div style="margin-top:10px;">
      <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
      <button id="clearStorageBtn" class="small" style="background:#e0e0e0;">🗑️ مسح بيانات التخزين</button>
    </div>
  </div>

  <div class="game" id="game" style="display:none;">
    <h2 id="gameName"></h2>
    <div class="top-players" id="topPlayers"></div>
    <table id="playersTable">
      <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>

    <h2 style="margin-top:40px;">📊 جدول الجولات</h2>
    <div class="buttons">
      <button id="addRoundBtn" class="add">➕ إضافة جولة جديدة</button>
      <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
    </div>
    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div class="wins" id="winsTable">
    <h2>🏆 ترتيب اللاعبين حسب عدد الفوز</h2>
    <table>
      <thead><tr><th>اللاعب</th><th>عدد الفوز</th></tr></thead>
      <tbody id="winsBody"></tbody>
    </table>
  </div>

  <!-- Modal: active rooms -->
  <div id="roomsModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h3>🎮 الجيمات الشغالة</h3>
      <div id="roomsList" style="margin-top:8px;"></div>
      <div style="text-align:center; margin-top:12px;">
        <button id="closeRoomsBtn" class="small">إغلاق</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, remove, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ==== Firebase config (استخدم إعداداتك) ====
    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.firebasestorage.app",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== app state (محلي) =====
    const DEFAULT_FIXED_PLAYERS = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    function isText(x){ return typeof x === 'string' && x.trim().length > 0; }

    function sanitizeForKey(name) {
      if(!isText(name)) return "player";
      return name.replace(/[.#$\[\]\/]/g, '_').trim();
    }
    function playersKeyFromArray(arr) {
      // keep order as selected; join by underscore, sanitized
      return arr.map(n => sanitizeForKey(n)).join('_');
    }
    // pad number to 3 digits
    function padNum(n) { return String(n).padStart(3, '0'); }

    let fixedPlayers = DEFAULT_FIXED_PLAYERS.slice();
    let players = [];
    let playersWins = [];
    let roundCount = 0;
    let gameEnded = false;
    let editableRound = null;
    let lastGameName = "";

    let currentGameId = null; // full key: playersKey + "_" + num (e.g. "romani_abir_geo_001")
    let currentGameRef = null;
    let currentUnsubscribe = null;
    let applyingRemote = false;

    // helpers
    function gameRefById(id) { return ref(db, `games/${id}`); }
    function gamesRootRef() { return ref(db, `games`); }

    // apply snapshot to local state + render
    function applySnapshotToLocal(snapVal) {
      if (!snapVal) return;
      applyingRemote = true;
      try {
        if (Array.isArray(snapVal.fixedPlayers)) fixedPlayers = snapVal.fixedPlayers.filter(isText);
        else fixedPlayers = DEFAULT_FIXED_PLAYERS.slice();

        players = [];
        if (Array.isArray(snapVal.players)) {
          players = snapVal.players.map(p => {
            if(!p || typeof p !== 'object') return null;
            const name = isText(p.name) ? p.name : null;
            if(!name) return null;
            const scores = Array.isArray(p.scores) ? p.scores.map(s => {
              if (s === null || s === undefined || s === "") return undefined;
              const n = Number(s);
              return Number.isNaN(n) ? undefined : n;
            }) : [];
            const total = (typeof p.total === 'number' && !Number.isNaN(p.total)) ? p.total : scores.reduce((a,b)=>a+(b||0),0);
            const wins = (typeof p.wins === 'number' && !Number.isNaN(p.wins)) ? p.wins : 0;
            return { name, scores, total, wins };
          }).filter(Boolean);
        }

        if (Array.isArray(snapVal.playersWins)) {
          const tmp = snapVal.playersWins.filter(x => x && isText(x.name)).map(x => ({ name: x.name, wins: Number.isInteger(x.wins) ? x.wins : (Number(x.wins) || 0) }));
          const map = {};
          tmp.forEach(w => map[w.name] = (map[w.name] || 0) + (w.wins||0));
          playersWins = Object.keys(map).map(n => ({ name: n, wins: map[n] }));
        } else {
          playersWins = players.map(p => ({ name: p.name, wins: p.wins || 0 }));
        }

        roundCount = (Number.isInteger(snapVal.roundCount) && snapVal.roundCount >= 0) ? snapVal.roundCount : Math.max(0, ...players.map(p=>p.scores.length));
        gameEnded = Boolean(snapVal.gameEnded) || false;
        editableRound = (snapVal.editableRound === null || Number.isInteger(snapVal.editableRound)) ? snapVal.editableRound : null;
        lastGameName = isText(snapVal.gameName) ? snapVal.gameName : "";
      } finally {
        renderPlayerChoices();
        renderWinsTable();
        if(players.length > 0 && !gameEnded) {
          document.getElementById("setup").style.display = "none";
          document.getElementById("game").style.display = "block";
          document.getElementById("gameName").textContent = "🎲 اللعبة: " + (lastGameName || "");
          renderTopPlayers();
          renderPlayersTable();
          renderRounds();
        } else {
          document.getElementById("setup").style.display = "block";
          document.getElementById("game").style.display = "none";
          renderPlayersTable();
          renderRounds();
        }
        applyingRemote = false;
      }
    }

    // attach onValue listener to a specific game id
    function attachListenerToGame(gameId) {
      // detach previous by setting currentGameId null (onValue returns unsubscribe in this SDK)
      if (currentUnsubscribe) currentUnsubscribe();
      currentGameId = gameId;
      currentGameRef = gameRefById(gameId);
      const unsub = onValue(currentGameRef, (snap) => {
        const val = snap.val();
        if (!val) return;
        applySnapshotToLocal(val);
      }, err => console.error("onValue error:", err));
      // keep unsubscribe function
      currentUnsubscribe = () => { try { unsub(); } catch(e){ /* ignore */ } };
    }

    // save current game state to DB
    async function saveToDB() {
      if (applyingRemote) return;
      if (!currentGameId) return;
      const payload = {
        fixedPlayers,
        players,
        playersWins,
        roundCount,
        gameEnded,
        editableRound,
        gameName: lastGameName
      };
      try {
        await set(gameRefById(currentGameId), payload);
      } catch (e) {
        console.error("Error saving to Firebase:", e);
      }
    }

    // list active games (not ended) and render modal list
    function openRoomsModal() {
      const modal = document.getElementById("roomsModal");
      const listDiv = document.getElementById("roomsList");
      listDiv.innerHTML = "<div class='muted'>... يجلب الجيمات من السيرفر</div>";
      modal.style.display = "flex";
      modal.setAttribute('aria-hidden', 'false');

      // listen once to /games and render active ones
      get(gamesRootRef()).then(snap => {
        const val = snap.val() || {};
        const items = [];
        Object.keys(val).forEach(k => {
          const g = val[k];
          if (!g) return;
          if (g.gameEnded) return; // only active
          const pNames = Array.isArray(g.players) ? g.players.map(x=>x.name).filter(isText) : [];
          const display = pNames.length ? pNames.join(' - ') : (g.gameName || k);
          // parse number from key suffix if exists
          const parts = k.split('_');
          const numPart = parts[parts.length-1];
          const numDisplay = /^\d+$/.test(numPart) ? Number(numPart) : null;
          items.push({ key: k, title: display, players: pNames, num: numDisplay });
        });
        if (items.length === 0) {
          listDiv.innerHTML = "<div class='muted'>لا توجد جيمات شغالة حاليًا.</div>";
          return;
        }
        // sort by key or any criteria (newest first by numeric suffix if exists)
        items.sort((a,b) => {
          const an = a.num||0, bn = b.num||0;
          return bn - an;
        });
        listDiv.innerHTML = "";
        items.forEach(it => {
          const row = document.createElement('div');
          row.className = 'game-row';
          const left = document.createElement('div');
          left.innerHTML = `<div class="game-title">${it.title}</div><div class="muted">معرف: ${it.key}</div>`;
          const joinBtn = document.createElement('button');
          joinBtn.className = 'small';
          joinBtn.textContent = '🎮 انضم للجيم ده';
          joinBtn.addEventListener('click', () => {
            // join this game
            attachListenerToGame(it.key);
            // close modal
            closeRoomsModal();
          });
          row.appendChild(left);
          row.appendChild(joinBtn);
          listDiv.appendChild(row);
        });
      }).catch(err => {
        console.error("Error fetching games:", err);
        listDiv.innerHTML = "<div class='muted'>حدث خطأ أثناء جلب الجيمات.</div>";
      });
    }

    function closeRoomsModal() {
      const modal = document.getElementById("roomsModal");
      modal.style.display = "none";
      modal.setAttribute('aria-hidden', 'true');
    }

    // when starting new game, generate game id as playersKey + _NNN
    async function createGameIdForPlayers(playersArray) {
      const baseKey = playersKeyFromArray(playersArray);
      // read existing games and find highest suffix index
      try {
        const snap = await get(gamesRootRef());
        const val = snap.val() || {};
        let maxNum = 0;
        Object.keys(val).forEach(k => {
          if (!k.startsWith(baseKey + "_")) return;
          const suffix = k.slice((baseKey + "_").length);
          // if suffix numeric then parse
          if (/^\d+$/.test(suffix)) {
            const n = Number(suffix);
            if (n > maxNum) maxNum = n;
          }
        });
        const newNum = maxNum + 1;
        return `${baseKey}_${padNum(newNum)}`;
      } catch (e) {
        console.error("Error creating game id:", e);
        // fallback with timestamp
        return `${baseKey}_${Date.now()}`;
      }
    }

    // UI rendering functions (preserve original)
    function renderPlayerChoices() {
      const container = document.getElementById("playerChoices");
      container.innerHTML = "";
      fixedPlayers.forEach(name => {
        const label = document.createElement("label");
        label.style.marginRight = "8px";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = name;
        if(players.some(p => p.name === name) && !gameEnded) checkbox.checked = true;
        label.appendChild(checkbox);
        label.append(" " + name + " ");
        container.appendChild(label);
      });
    }

    function addPlayer() {
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if(!name) return;
      if(!fixedPlayers.includes(name)) fixedPlayers.push(name);
      input.value = "";
      if (currentGameId) saveToDB();
      renderPlayerChoices();
    }

    function addGame() {
      const input = document.getElementById("newGameInput");
      const name = input.value.trim();
      if(!name) return;
      const select = document.getElementById("gameSelect");
      if(!Array.from(select.options).some(o=>o.value===name)) {
        const option = document.createElement("option");
        option.textContent = name;
        option.value = name;
        select.appendChild(option);
      }
      select.value = name;
      input.value = "";
    }

    async function startGame() {
      const gameSelect = document.getElementById("gameSelect");
      const gameName = gameSelect.value;
      document.getElementById("gameName").textContent = "🎲 اللعبة: " + gameName;

      const checked = Array.from(document.querySelectorAll("#playerChoices input:checked")).map(c => c.value);

      if (checked.length < 2 && players.length === 0) {
        alert("لازم تختار على الأقل لاعبين!");
        return;
      }

      if(players.length > 0 && !gameEnded) {
        // resume existing
      } else {
        players = [];
        checked.forEach(name => {
          const existingWin = playersWins.find(p => p.name === name);
          if(existingWin) players.push({ name, total: 0, scores: [], wins: existingWin.wins });
          else {
            players.push({ name, total: 0, scores: [], wins: 0 });
            if(!playersWins.find(p=>p.name===name)) playersWins.push({ name: name, wins: 0 });
          }
        });
      }

      if (players.length < 2) {
        alert("لازم تختار على الأقل لاعبين!");
        return;
      }

      // build game id based on players (and add numeric suffix)
      const playersArr = players.map(p => p.name);
      const newGameId = await createGameIdForPlayers(playersArr);

      attachListenerToGame(newGameId);

      roundCount = Math.max( roundCount, ...players.map(p => p.scores.length) );
      gameEnded = false;
      editableRound = (roundCount>0 ? roundCount-1 : null);
      lastGameName = gameName;

      // save initial state to DB
      saveToDB();

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";

      renderTopPlayers();
      renderPlayersTable();
      renderRounds();
    }

    function renderTopPlayers() {
      const topDiv = document.getElementById("topPlayers");
      topDiv.innerHTML = "";
      const filtered = players.filter(p => typeof p.total === 'number' && p.total > 0);
      filtered.sort((a,b) => b.total - a.total);
      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `${p.name}<br>⭐ ${p.total}`;
        topDiv.appendChild(card);
      });
    }

    function renderPlayersTable() {
      const body = document.getElementById("playersBody");
      body.innerHTML = "";
      if(players.length === 0) {
        fixedPlayers.forEach(name => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${name}</td><td>0</td>`;
          body.appendChild(row);
        });
        return;
      }
      players.slice().sort((a,b)=> (b.total||0) - (a.total||0)).forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.name}</td><td>${p.total || 0}</td>`;
        body.appendChild(row);
      });
    }

    function renderRounds() {
      const head = document.getElementById("roundsHead");
      const body = document.getElementById("roundsBody");

      let headHTML = "<tr><th>الجولة</th>";
      players.forEach(p => { headHTML += `<th>${p.name}</th>`; });
      headHTML += "<th>تعديل</th></tr>";
      head.innerHTML = headHTML;

      let totalRow = "<tr style='background:#eee; font-weight:bold;'><td>المجموع</td>";
      players.forEach(p => { totalRow += `<td>${p.total || 0}</td>`; });
      totalRow += "<td>-</td></tr>";
      body.innerHTML = totalRow;

      for (let r = roundCount - 1; r >= 0; r--) {
        let row = `<tr><td>جولة ${r+1}</td>`;
        players.forEach((p, i) => {
          const val = (Array.isArray(p.scores) && p.scores[r] !== undefined) ? p.scores[r] : "";
          const disabled = (editableRound === r && !gameEnded) ? "" : "disabled";
          row += `<td><input type="number" value="${val}" onchange="updateScore(${i},${r},this.value)" ${disabled}></td>`;
        });
        row += `<td><button class="edit-small" onclick="editRound(${r})" ${gameEnded ? "disabled" : ""}>✏️</button></td>`;
        row += "</tr>";
        body.innerHTML += row;
      }
    }

    function addRound() {
      if(gameEnded) return;
      roundCount++;
      players.forEach(p => {
        if(!Array.isArray(p.scores)) p.scores = [];
        while(p.scores.length < roundCount) p.scores.push(undefined);
      });
      editableRound = roundCount - 1;
      saveToDB();
      renderRounds();
    }

    function editRound(r) {
      if(gameEnded) return;
      editableRound = r;
      saveToDB();
      renderRounds();
      alert("ممكن تعدل جولة " + (r+1));
    }

    function updateScore(playerIndex, roundIndex, value) {
      if(!players[playerIndex]) return;
      if(!Array.isArray(players[playerIndex].scores)) players[playerIndex].scores = [];
      players[playerIndex].scores[roundIndex] = value === "" ? undefined : Number(value);
      players[playerIndex].total = players[playerIndex].scores.reduce((a,b)=>a + (b||0), 0);
      saveToDB();
      renderTopPlayers();
      renderPlayersTable();
      renderRounds();
    }

    function endGame() {
      if(players.length === 0) return;
      gameEnded = true;
      editableRound = null;

      let winner = players.reduce((best, cur) => {
        if(!best) return cur;
        return (cur.total > (best.total||0)) ? cur : best;
      }, null);

      if(winner) {
        winner.wins = (winner.wins || 0) + 1;
        const found = playersWins.find(p => p.name === winner.name);
        if(found) found.wins = winner.wins;
        else playersWins.push({ name: winner.name, wins: winner.wins });
      }

      saveToDB();
      renderPlayersTable();
      renderWinsTable();

      document.querySelectorAll(".add, .end, .edit-small").forEach(btn => btn.disabled = true);

      const gameDiv = document.getElementById("game");
      const old = gameDiv.querySelector("button.start.newgamebtn");
      if(old) old.remove();
      const newBtn = document.createElement("button");
      newBtn.textContent = "🔄 جيم جديد";
      newBtn.className = "start newgamebtn";
      newBtn.addEventListener('click', newGame);
      gameDiv.appendChild(newBtn);

      alert("تم إنهاء الجيم ✅ الفائز: " + (winner ? winner.name : "لا يوجد"));
    }

    function newGame() {
      players = [];
      roundCount = 0;
      gameEnded = false;
      editableRound = null;
      lastGameName = "";
      if (currentGameId) {
        set(gameRefById(currentGameId), {
          fixedPlayers: DEFAULT_FIXED_PLAYERS.slice(),
          players: [],
          playersWins: [],
          roundCount: 0,
          gameEnded: false,
          editableRound: null,
          gameName: ""
        });
      }
      document.getElementById("setup").style.display = "block";
      document.getElementById("game").style.display = "none";

      document.getElementById("topPlayers").innerHTML = "";
      document.getElementById("playersBody").innerHTML = "";
      document.getElementById("roundsHead").innerHTML = "";
      document.getElementById("roundsBody").innerHTML = "";
      document.getElementById("gameName").textContent = "";

      renderPlayerChoices();
      renderWinsTable();
    }

    function renderWinsTable() {
      const body = document.getElementById("winsBody");
      body.innerHTML = "";
      playersWins.slice().sort((a,b)=> (b.wins||0) - (a.wins||0)).forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${p.name}</td><td>${p.wins || 0}</td>`;
        body.appendChild(row);
      });
    }

    function clearStorage() {
      if(!confirm("هل تريد مسح كل بيانات التطبيق من الـ Database لهذا الجيم؟ (سيتم فقدان كل السكورات والجولات)")) return;
      if (!currentGameId) {
        alert("لا يوجد جيم متصل به هذا الجهاز الآن.");
        return;
      }
      remove(gameRefById(currentGameId)).then(() => {
        fixedPlayers = DEFAULT_FIXED_PLAYERS.slice();
        players = [];
        playersWins = [];
        roundCount = 0;
        gameEnded = false;
        editableRound = null;
        lastGameName = "";
        currentGameId = null;
        currentGameRef = null;
        if (currentUnsubscribe) currentUnsubscribe();
        document.getElementById("setup").style.display = "block";
        document.getElementById("game").style.display = "none";
        renderPlayerChoices();
        renderPlayersTable();
        renderRounds();
        renderWinsTable();
        alert("تم مسح بيانات الجيم من الـ Database. الصفحة جاهزة للعمل من جديد.");
      }).catch(err => {
        console.error("Error removing game:", err);
        alert("حدث خطأ أثناء مسح البيانات.");
      });
    }

    // events
    window.addEventListener('DOMContentLoaded', () => {
      renderPlayerChoices();
      renderWinsTable();

      document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
      document.getElementById('addGameBtn').addEventListener('click', addGame);
      document.getElementById('startGameBtn').addEventListener('click', startGame);
      document.getElementById('addRoundBtn').addEventListener('click', addRound);
      document.getElementById('endGameBtn').addEventListener('click', endGame);
      document.getElementById('clearStorageBtn').addEventListener('click', clearStorage);

      // rooms modal handlers
      document.getElementById('showRoomsBtn').addEventListener('click', openRoomsModal);
      document.getElementById('closeRoomsBtn').addEventListener('click', closeRoomsModal);
      document.getElementById('roomsModal').addEventListener('click', (e) => {
        if (e.target.id === 'roomsModal') closeRoomsModal();
      });
    });

    // expose functions used inline
    window.updateScore = updateScore;
    window.editRound = editRound;
    window.addRound = addRound;
    window.endGame = endGame;
    window.newGame = newGame;
    window.addPlayer = addPlayer;
    window.addGame = addGame;
    window.startGame = startGame;
    window.clearStorage = clearStorage;

  </script>
</body>
</html>
