<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 تسجيل السكورات - Tana & Rona</title>
<style>
  body { font-family: Arial; background:#f7f7f7; margin:0; padding:20px; direction:rtl; }
  h1 { color:#b88b4a; text-align:center; }
  .btn { padding:5px 10px; margin:5px; background:#b88b4a; color:white; border:none; border-radius:5px; cursor:pointer; }
  table { width:100%; border-collapse: collapse; margin-top:10px; }
  th, td { border:1px solid #ccc; padding:5px; text-align:center; }
  .toast { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:10px 20px; border-radius:5px; display:none; }
</style>
</head>
<body>

<h1>🎮 تسجيل السكورات - Tana & Rona</h1>

<div>
  <input id="newPlayerName" placeholder="اسم اللاعب">
  <button class="btn" onclick="addPlayer()">إضافة لاعب</button>
</div>

<div>
  <input id="newGameName" placeholder="اسم الجيم">
  <button class="btn" onclick="addGame()">إضافة جيم</button>
</div>

<h2>الجيمات الحالية:</h2>
<div id="gamesList"></div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  // إعداد Firebase
  const firebaseConfig = {
    apiKey: "API_KEY_HERE",
    authDomain: "PROJECT_ID.firebaseapp.com",
    databaseURL: "https://PROJECT_ID.firebaseio.com",
    projectId: "PROJECT_ID",
    storageBucket: "PROJECT_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // تنبيه Toast
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(()=>toast.style.display='none',2000);
  }

  // إضافة لاعب
  function addPlayer(){
    const name = document.getElementById('newPlayerName').value.trim();
    if(!name) return showToast("ادخل اسم اللاعب!");
    const playerId = Date.now().toString();
    db.ref('players/'+playerId).set({ name, totalScore:0 });
    document.getElementById('newPlayerName').value='';
    showToast("تم إضافة اللاعب!");
  }

  // إضافة جيم
  function addGame(){
    const name = document.getElementById('newGameName').value.trim();
    if(!name) return showToast("ادخل اسم الجيم!");
    const gameId = Date.now().toString();
    db.ref('games/'+gameId).set({ name, players:{} });
    document.getElementById('newGameName').value='';
    showToast("تم إنشاء الجيم!");
  }

  // عرض الجيمات
  const gamesListDiv = document.getElementById('gamesList');
  db.ref('games').on('value', snapshot => {
    gamesListDiv.innerHTML='';
    snapshot.forEach(gameSnap=>{
      const game = gameSnap.val();
      const gameId = gameSnap.key;
      const btn = document.createElement('button');
      btn.className='btn';
      btn.innerText = game.name;
      btn.onclick=()=>openGame(gameId, game.name);
      gamesListDiv.appendChild(btn);
    });
  });

  // فتح الجيم
  async function openGame(gameId, gameName){
    const gameRef = db.ref('games/'+gameId);
    const playersSnap = await db.ref('players').get();
    const players = playersSnap.val() || {};
    const gameSnap = await gameRef.get();
    const game = gameSnap.val() || {players:{}};

    let tbody='';
    for(const pid in players){
      const score = game.players[pid]?.score || 0;
      tbody+=`<tr data-pid="${pid}"><td>${players[pid].name}</td><td><input type="number" value="${score}" class="score-input"></td></tr>`;
    }

    const modal = document.createElement('div');
    modal.style.position='fixed';
    modal.style.top='0'; modal.style.left='0';
    modal.style.width='100%'; modal.style.height='100%';
    modal.style.background='rgba(0,0,0,0.6)';
    modal.style.display='flex'; modal.style.justifyContent='center'; modal.style.alignItems='center';
    modal.innerHTML=`
      <div style="background:white;padding:20px;border-radius:10px;width:90%;max-width:600px;max-height:80%;overflow:auto;">
        <h2>${gameName}</h2>
        <table><thead><tr><th>اللاعب</th><th>السكور</th></tr></thead><tbody>${tbody}</tbody></table>
        <button class="btn" id="saveBtn">حفظ</button>
        <button class="btn" id="closeBtn">إغلاق</button>
      </div>
    `;
    document.body.appendChild(modal);

    modal.querySelector('#saveBtn').onclick=async()=>{
      const updates={};
      modal.querySelectorAll('.score-input').forEach(input=>{
        const pid = input.closest('tr').dataset.pid;
        updates[pid+'/score']=Number(input.value);
      });
      await gameRef.child('players').update(updates);
      showToast("تم تحديث السكورات!");
    }

    modal.querySelector('#closeBtn').onclick=()=>{
      document.body.removeChild(modal);
    }
  }
</script>
</body>
</html>
