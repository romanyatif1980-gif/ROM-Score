<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎮 تسجيل السكورات</title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background: #f7f7f7; margin: 0; padding: 20px; }
    h1, h2 { text-align: center; color: #333; }
    .setup, .game, .wins { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin: 20px auto; max-width: 900px; }
    input, select, button { padding: 7px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { cursor: pointer; font-weight: bold; }
    .start { background: #4caf50; color: white; }
    .add { background: #2196f3; color: white; }
    .end { background: #f44336; color: white; }
    .edit-small { background: #ff9800; color: white; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
    .top-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 150px; text-align: center; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #eee; }
    input[type="number"] { width: 70px; padding: 5px; text-align: center; }
    .buttons { margin: 20px 0; text-align: center; }
    .buttons button { margin: 5px; padding: 10px 15px; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🎮 تسجيل السكورات</h1>

  <div class="setup" id="setup">
    <h2>⚙️ إعداد الجيم</h2>
    <label>🎲 اختر اللعبة:</label>
    <select id="gameSelect">
      <option>دومينو</option>
      <option>الطاولة</option>
      <option>الشطرنج</option>
      <option>لعبة الورق</option>
    </select>
    <input type="text" id="newGameInput" placeholder="إضافة لعبة جديدة">
    <button id="addGameBtn" class="add">➕ إضافة لعبة</button>

    <hr>

    <button id="showGamesBtn" class="add">📂 عرض الجيمات الشغالة</button>

    <h3>👥 اختر اللاعبين:</h3>
    <div id="playerChoices"></div>
    <input type="text" id="newPlayerInput" placeholder="إضافة لاعب جديد">
    <button id="addPlayerBtn" class="add">➕ إضافة لاعب</button>

    <br>
    <button id="startGameBtn" class="start">🚀 ابدأ الجيم</button>
  </div>

  <div class="game" id="game" style="display:none;">
    <h2 id="gameName"></h2>
    <div class="top-players" id="topPlayers"></div>
    <table id="playersTable">
      <thead><tr><th>اللاعب</th><th>المجموع</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>

    <h2 style="margin-top:40px;">📊 جدول الجولات</h2>
    <div class="buttons">
      <button id="addRoundBtn" class="add">➕ إضافة جولة جديدة</button>
      <button id="endGameBtn" class="end">✅ إنهاء الجيم</button>
    </div>
    <table id="roundsTable">
      <thead id="roundsHead"></thead>
      <tbody id="roundsBody"></tbody>
    </table>
  </div>

  <div class="wins" id="winsTable">
    <h2>🏆 ترتيب اللاعبين حسب عدد الفوز</h2>
    <table>
      <thead><tr><th>اللاعب</th><th>عدد الفوز</th></tr></thead>
      <tbody id="winsBody"></tbody>
    </table>
  </div>

  <script type="module">
    // 🔥 Firebase إعداد
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIwYvgqRsv3hA93C_VR-qzufsiy_OnE4s",
      authDomain: "rom-score.firebaseapp.com",
      databaseURL: "https://rom-score-default-rtdb.firebaseio.com",
      projectId: "rom-score",
      storageBucket: "rom-score.firebasestorage.app",
      messagingSenderId: "1009545441375",
      appId: "1:1009545441375:web:460f2db0c984d24936abea",
      measurementId: "G-BKNE7YZ7FM"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 👤 اسم اللاعب الحالي (ثابت هنا)
    const currentPlayer = "روماني";

    let fixedPlayers = ["روماني","عبير","جورج","نرمين","هاني","نيبال","شنوده","هناء"];
    let players = [];
    let playersWins = [];
    let roundCount = 0;
    let editableRound = null;
    let gameEnded = false;
    let currentGameName = "";

    function renderPlayerChoices() {
      const div = document.getElementById("playerChoices");
      div.innerHTML = "";
      fixedPlayers.forEach(name => {
        const label = document.createElement("label");
        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.value = name;
        label.appendChild(chk);
        label.append(" " + name + " ");
        div.appendChild(label);
      });
    }

    function addPlayer() {
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if(name) {
        fixedPlayers.push(name);
        renderPlayerChoices();
        input.value = "";
      }
    }

    function addGame() {
      const input = document.getElementById("newGameInput");
      const name = input.value.trim();
      if(name) {
        const sel = document.getElementById("gameSelect");
        const opt = document.createElement("option");
        opt.textContent = name;
        sel.appendChild(opt);
        sel.value = name;
        input.value = "";
      }
    }

    async function startGame() {
      const gameSelect = document.getElementById("gameSelect");
      currentGameName = gameSelect.value;
      const checked = document.querySelectorAll("#playerChoices input:checked");
      if (checked.length < 2) return alert("لازم تختار لاعبين على الأقل!");

      players = Array.from(checked).map(c => ({ name: c.value, total: 0, scores: [] }));

      const gameRef = ref(db, `games/${currentPlayer}/${currentGameName}`);
      await set(gameRef, { players, roundCount: 0, ended: false });

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "block";
      document.getElementById("gameName").textContent = `🎲 اللعبة: ${currentGameName}`;

      subscribeToGame();
    }

    function subscribeToGame() {
      const gameRef = ref(db, `games/${currentPlayer}/${currentGameName}`);
      onValue(gameRef, snap => {
        if (!snap.exists()) return;
        const data = snap.val();
        players = data.players || [];
        roundCount = data.roundCount || 0;
        gameEnded = data.ended || false;
        renderPlayersTable();
        renderTopPlayers();
        renderRounds();
      });
    }

    async function addRound() {
      if (gameEnded) return;
      roundCount++;
      editableRound = roundCount-1;
      await update(ref(db, `games/${currentPlayer}/${currentGameName}`), { roundCount });
    }

    async function updateScore(i, r, val) {
      players[i].scores[r] = Number(val);
      players[i].total = players[i].scores.reduce((a,b)=>a+(b||0),0);
      await update(ref(db, `games/${currentPlayer}/${currentGameName}`), { players });
    }

    async function endGame() {
      gameEnded = true;
      await update(ref(db, `games/${currentPlayer}/${currentGameName}`), { ended: true });
      const winner = players.reduce((a,b)=> b.total > a.total ? b : a);
      await update(ref(db, `wins/${winner.name}`), { name: winner.name, wins: (playersWins.find(p=>p.name===winner.name)?.wins||0)+1 });
      alert("🎉 الفائز: " + winner.name);
    }

    function renderTopPlayers() {
      const div = document.getElementById("topPlayers");
      div.innerHTML = "";
      players.slice().sort((a,b)=>b.total-a.total).forEach(p=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`${p.name}<br>⭐ ${p.total}`;
        div.appendChild(card);
      });
    }

    function renderPlayersTable() {
      const body=document.getElementById("playersBody");
      body.innerHTML="";
      players.slice().sort((a,b)=>b.total-a.total).forEach(p=>{
        body.innerHTML += `<tr><td>${p.name}</td><td>${p.total}</td></tr>`;
      });
    }

    function renderRounds() {
      const head=document.getElementById("roundsHead");
      const body=document.getElementById("roundsBody");
      let h="<tr><th>الجولة</th>";
      players.forEach(p=>h+=`<th>${p.name}</th>`);
      h+="</tr>";
      head.innerHTML=h;
      body.innerHTML="";
      for(let r=0;r<roundCount;r++){
        let row=`<tr><td>${r+1}</td>`;
        players.forEach((p,i)=>{
          const v=p.scores[r]||"";
          row+=`<td><input type="number" value="${v}" onchange="updateScore(${i},${r},this.value)"></td>`;
        });
        row+="</tr>";
        body.innerHTML+=row;
      }
    }

    async function showGames() {
      const snapshot = await get(ref(db, `games/${currentPlayer}`));
      if (!snapshot.exists()) return alert("لا توجد جيمات حالياً");
      const games = Object.keys(snapshot.val());
      alert("🎮 الجيمات الشغالة:\n" + games.join("\n"));
    }

    window.addEventListener("DOMContentLoaded", ()=>{
      renderPlayerChoices();
      document.getElementById("addPlayerBtn").onclick = addPlayer;
      document.getElementById("addGameBtn").onclick = addGame;
      document.getElementById("startGameBtn").onclick = startGame;
      document.getElementById("addRoundBtn").onclick = addRound;
      document.getElementById("endGameBtn").onclick = endGame;
      document.getElementById("showGamesBtn").onclick = showGames;
    });
  </script>
</body>
</html>
