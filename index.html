<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة النقاط</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    margin: 20px;
  }
  h2 { margin-top: 25px; }
  .box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 0 6px #0002;
  }
  button {
    padding: 7px 15px;
    border: none;
    border-radius: 8px;
    background: #0097db;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #007eb7; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
  }
  input[type=number] {
    width: 60px;
    padding: 4px;
  }
  .winner {
    background: #d6ffd6;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>لعبة النقاط — نسخة Real-Time الجديدة ⚡</h1>

<!-- ░░░ القائمة الرئيسية ░░░ -->
<div class="box">
  <h2>إدارة اللاعبين</h2>
  
  <input id="newPlayer" placeholder="اسم اللاعب">
  <button id="addPlayerBtn">إضافة لاعب</button>

  <h3>اللاعبين المحفوظين:</h3>
  <div id="playersList"></div>

  <hr>

  <h2>بدء جيم جديد</h2>
  <button id="startGameBtn">ابدأ الجيم</button>
</div>

<!-- ░░░ واجهة الجيم ░░░ -->
<div id="gameArea" class="box" style="display:none;">
  <h2>الجيم: <span id="gameName"></span></h2>

  <button id="addRoundBtn">إضافة جولة</button>
  <button id="endGameBtn">إنهاء الجيم</button>

  <h3>النتائج</h3>
  <table id="scoresTable"></table>

  <h3>اللاعبين — المجموع</h3>
  <table id="playersTotals"></table>
</div>

<!-- ░░░ جدول الفائزين الدائم ░░░ -->
<div class="box">
  <h2>جدول الفائزين 🏆 (المجموع عبر الجيمات)</h2>
  <table id="winsTable"></table>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getDatabase, ref, push, set, update, onValue, get 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ░░░ ضع الـ Firebase config الخاص بك هنا ░░░ */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ░░░ إدارة اللاعبين ░░░ */

const playersListDiv = document.getElementById("playersList");
const addPlayerBtn = document.getElementById("addPlayerBtn");
const newPlayerInput = document.getElementById("newPlayer");
const startGameBtn = document.getElementById("startGameBtn");

let savedPlayers = [];
let currentGameId = null;
let currentPlayers = {};

function loadPlayers() {
  onValue(ref(db, "playersList"), snap => {
    savedPlayers = snap.val() || {};
    renderPlayersList();
  });
}

function renderPlayersList() {
  playersListDiv.innerHTML = "";
  Object.keys(savedPlayers).forEach(id => {
    const name = savedPlayers[id];
    const div = document.createElement("div");
    div.textContent = "• " + name;
    playersListDiv.appendChild(div);
  });
}

addPlayerBtn.onclick = () => {
  const name = newPlayerInput.value.trim();
  if (!name) return;

  const id = name.replace(/\s+/g, "_");
  set(ref(db, "playersList/" + id), name);
  newPlayerInput.value = "";
};


/* ░░░ بدء الجيم ░░░ */

startGameBtn.onclick = async () => {
  const players = Object.keys(savedPlayers);
  if (players.length < 2) {
    alert("يجب إضافة لاعبين أولاً");
    return;
  }

  const gameRef = push(ref(db, "games"));
  currentGameId = gameRef.key;

  const obj = {
    name: "Game_" + Date.now(),
    ended: false,
    players: {},
    rounds: {}
  };

  players.forEach(pid => {
    obj.players[pid] = {
      name: savedPlayers[pid],
      total: 0
    };
  });

  await set(gameRef, obj);

  document.getElementById("gameArea").style.display = "block";
  document.getElementById("gameName").textContent = obj.name;

  attachGameListeners(currentGameId);
};

/* ░░░ Real-Time Listeners ░░░ */

function attachGameListeners(gameId) {
  const base = ref(db, "games/" + gameId);

  // players
  onValue(ref(db, `games/${gameId}/players`), snap => {
    currentPlayers = snap.val() || {};
    renderPlayersTotals();
  });

  // rounds
  onValue(ref(db, `games/${gameId}/rounds`), snap => {
    renderRounds(snap.val() || {});
  });
}


/* ░░░ عرض النتائج ░░░ */

function renderRounds(rounds) {
  const tbl = document.getElementById("scoresTable");
  tbl.innerHTML = "";

  // header
  let head = "<tr><th>الجولة</th>";
  Object.keys(currentPlayers).forEach(pid => {
    head += `<th>${currentPlayers[pid].name}</th>`;
  });
  head += "</tr>";
  tbl.innerHTML += head;

  // rounds
  Object.keys(rounds).forEach(rid => {
    const r = rounds[rid];
    let row = `<tr><td>${rid}</td>`;

    Object.keys(currentPlayers).forEach(pid => {
      const v = r.values?.[pid] ?? "";
      row += `<td><input type="number" data-round="${rid}" data-player="${pid}" value="${v}"></td>`;
    });

    row += "</tr>";
    tbl.innerHTML += row;
  });

  // listeners
  document.querySelectorAll("#scoresTable input").forEach(inp => {
    inp.onchange = () => {
      const pid = inp.dataset.player;
      const rid = inp.dataset.round;
      const val = Number(inp.value) || 0;

      update(ref(db, `games/${currentGameId}/rounds/${rid}/values/${pid}`), val);
      recalcTotals();
    };
  });
}

function renderPlayersTotals() {
  const tbl = document.getElementById("playersTotals");
  tbl.innerHTML = "<tr><th>اللاعب</th><th>المجموع</th></tr>";

  Object.keys(currentPlayers).forEach(pid => {
    const p = currentPlayers[pid];
    tbl.innerHTML += `<tr><td>${p.name}</td><td>${p.total}</td></tr>`;
  });
}


/* ░░░ إضافة جولة جديدة ░░░ */

document.getElementById("addRoundBtn").onclick = () => {
  if (!currentGameId) return;

  const rid = "R" + Date.now();
  const obj = {
    updatedAt: Date.now(),
    values: {}
  };

  Object.keys(currentPlayers).forEach(pid => obj.values[pid] = 0);

  set(ref(db, `games/${currentGameId}/rounds/${rid}`), obj);
};


/* ░░░ حساب المجموع ░░░ */

async function recalcTotals() {
  const roundsSnap = await get(ref(db, `games/${currentGameId}/rounds`));
  const rounds = roundsSnap.val() || {};

  const totals = {};
  Object.keys(currentPlayers).forEach(pid => totals[pid] = 0);

  Object.keys(rounds).forEach(rid => {
    const values = rounds[rid].values || {};
    Object.keys(values).forEach(pid => {
      totals[pid] += Number(values[pid] || 0);
    });
  });

  // save new totals
  Object.keys(totals).forEach(pid => {
    update(ref(db, `games/${currentGameId}/players/${pid}`), { total: totals[pid] });
  });
}


/* ░░░ إنهاء الجيم ░░░ */

document.getElementById("endGameBtn").onclick = async () => {
  if (!currentGameId) return;

  await update(ref(db, `games/${currentGameId}`), { ended: true });

  const totals = Object.values(currentPlayers).map(p => p.total);
  const maxScore = Math.max(...totals);
  const winners = Object.keys(currentPlayers)
    .filter(pid => currentPlayers[pid].total === maxScore);

  // سجل الفوز
  winners.forEach(pid => {
    update(ref(db, `wins/${pid}`), {
      name: currentPlayers[pid].name,
      wins: (currentPlayers[pid].wins || 0) + 1
    });
  });

  alert("🎉 الفائز: " + winners.map(pid => currentPlayers[pid].name).join(", "));
};


/* ░░░ جدول الفائزين ░░░ */

function loadWins() {
  onValue(ref(db, "wins"), snap => {
    const val = snap.val() || {};
    renderWins(val);
  });
}

function renderWins(wins) {
  const tbl = document.getElementById("winsTable");
  tbl.innerHTML = "<tr><th>اللاعب</th><th>عدد مرات الفوز</th></tr>";

  Object.keys(wins).forEach(pid => {
    tbl.innerHTML += `<tr><td>${wins[pid].name}</td><td>${wins[pid].wins}</td></tr>`;
  });
}

/* بدء الشغل */
loadPlayers();
loadWins();
</script>

</body>
</html>
